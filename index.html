<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Immersion · Student Dashboard + Leaderboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #1a1a3e 50%, #24243e 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }
        /* Auth Card */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .auth-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border-radius: 32px;
            padding: 40px;
            width: 450px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .auth-card h2 {
            color: white;
            margin-bottom: 25px;
            text-align: center;
        }
        .auth-card input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: none;
            border-radius: 12px;
            background: rgba(255,255,255,0.95);
            font-size: 16px;
        }
        .auth-card button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .toggle-auth {
            text-align: center;
            margin-top: 20px;
            color: rgba(255,255,255,0.8);
            cursor: pointer;
        }
        .error-message {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
        }
        /* Dashboard */
        .dashboard {
            display: none;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 15px 25px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logout-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 20px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
        }
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }
        .daily-task {
            background: rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 30px;
        }
        .task-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 6px 15px;
            border-radius: 30px;
            font-size: 0.75rem;
            margin-bottom: 15px;
        }
        .submit-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        .submitted-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(72,187,120,0.2);
            border: 1px solid #48bb78;
            padding: 10px 20px;
            border-radius: 40px;
            color: #48bb78;
        }
        .leaderboard-section {
            background: rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 25px;
        }
        .leaderboard-section h3 {
            margin-bottom: 20px;
        }
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .rank-number {
            width: 40px;
            font-weight: bold;
            color: #667eea;
        }
        .rank-name {
            flex: 1;
            margin-left: 10px;
        }
        .rank-score {
            color: #ffd700;
            font-weight: bold;
        }
        .top-1 .rank-number { color: #ffd700; }
        .top-2 .rank-number { color: #c0c0c0; }
        .top-3 .rank-number { color: #cd7f32; }
        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(255,255,255,0.6);
        }
        @media (max-width: 768px) {
            .auth-card { width: 95%; padding: 30px; }
            .stats-grid { grid-template-columns: 1fr; }
            .header { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

<!-- Auth Container -->
<div id="authContainer" class="auth-container">
    <div class="auth-card">
        <h2 id="authTitle">Welcome to IELTS Immersion</h2>
        <input type="email" id="email" placeholder="Email address" autocomplete="email">
        <input type="password" id="password" placeholder="Password" autocomplete="current-password">
        <div id="errorMessage" class="error-message"></div>
        <button id="authButton">Sign In</button>
        <div id="toggleAuth" class="toggle-auth">Don't have an account? Create one →</div>
    </div>
</div>

<!-- Dashboard -->
<div id="dashboard" class="dashboard">
    <div class="container">
        <div class="header">
            <h1>🎯 IELTS Immersion Platform</h1>
            <div class="user-info">
                <span id="userEmail" style="color:#a8b2ff;"></span>
                <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
            </div>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="loading">Loading your stats...</div>
        </div>

        <div class="daily-task" id="dailyTask">
            <div class="loading">Loading today's task...</div>
        </div>

        <div class="leaderboard-section">
            <h3>🏆 Leaderboard (All Students)</h3>
            <div id="leaderboardList">
                <div class="loading">Loading leaderboard...</div>
            </div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // SUPABASE CREDENTIALS (your existing project)
    // ============================================================
    const SUPABASE_URL = 'https://wqoshwbtxulnlfccbuvi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indxb3Nod2J0eHVsbmxmY2NidXZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0ODAwMTgsImV4cCI6MjA5MzA1NjAxOH0.ChxkoIlruVPtontdf0_uvG__XSpZdVhScxR1f-F_ArA';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null;
    let isLogin = true;

    // ---------- Auth Functions ----------
    async function signUp(email, password) {
        const { data, error } = await supabase.auth.signUp({
            email, password,
            options: { data: { full_name: email.split('@')[0] } }
        });
        if (error) { showError(error.message); return false; }
        if (data.user) {
            alert('Account created! You can now sign in.');
            return true;
        }
        return false;
    }

    async function signIn(email, password) {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) { showError(error.message); return false; }
        if (data.user) {
            currentUser = data.user;
            showDashboard();
            await loadDashboardData();
            return true;
        }
        return false;
    }

    async function signOut() {
        await supabase.auth.signOut();
        currentUser = null;
        showAuth();
    }

    function showError(msg) {
        const errDiv = document.getElementById('errorMessage');
        errDiv.textContent = msg;
        errDiv.style.display = 'block';
        setTimeout(() => errDiv.style.display = 'none', 4000);
    }

    // ---------- Dashboard Functions ----------
    async function loadDashboardData() {
        // User's own progress
        const { data: progress } = await supabase
            .from('progress')
            .select('*')
            .eq('student_id', currentUser.id);

        const completedTasks = progress?.filter(p => p.task_completed).length || 0;
        const totalTasks = progress?.length || 0;
        const avgScore = progress?.length ?
            Math.round(progress.reduce((s, p) => s + (p.speaking_score || 0), 0) / progress.length) : 0;
        const streak = 7; // simple placeholder

        document.getElementById('statsGrid').innerHTML = `
            <div class="stat-card"><div class="stat-number">${completedTasks}</div><div>Tasks Completed</div></div>
            <div class="stat-card"><div class="stat-number">${totalTasks}</div><div>Total Tasks</div></div>
            <div class="stat-card"><div class="stat-number">${avgScore}</div><div>Average Score</div></div>
            <div class="stat-card"><div class="stat-number">🔥 ${streak}</div><div>Day Streak</div></div>
        `;

        // Today's task
        const today = new Date().toISOString().split('T')[0];
        const todayProgress = progress?.find(p => p.task_date === today);
        const isCompleted = todayProgress?.task_completed || false;

        document.getElementById('dailyTask').innerHTML = `
            <div class="task-badge">🎤 Speaking Task - Part 2</div>
            <h2>Describe a person who has influenced you</h2>
            <p>You should say: Who the person is, How you know them, What they did, And explain why they influenced you.</p>
            ${isCompleted ?
                `<div class="submitted-badge">✅ Task completed! Great job!</div>` :
                `<button class="submit-btn" onclick="submitTask()">🎙️ Submit Your Answer</button>`
            }
        `;

        // Leaderboard (all students)
        const { data: leaderboard } = await supabase
            .from('leaderboard_view')
            .select('*')
            .order('total_score', { ascending: false })
            .limit(20);

        if (leaderboard && leaderboard.length > 0) {
            document.getElementById('leaderboardList').innerHTML = leaderboard.map((item, idx) => `
                <div class="leaderboard-item ${idx === 0 ? 'top-1' : idx === 1 ? 'top-2' : idx === 2 ? 'top-3' : ''}">
                    <div style="display: flex; align-items: center;">
                        <span class="rank-number">#${idx+1}</span>
                        <span class="rank-name">${item.full_name || 'Student'}</span>
                    </div>
                    <span class="rank-score">⭐ ${Math.round(item.total_score || 0)} pts</span>
                </div>
            `).join('');
        } else {
            document.getElementById('leaderboardList').innerHTML = '<div class="loading">No scores yet. Be the first!</div>';
        }
    }

    async function submitTask() {
        const today = new Date().toISOString().split('T')[0];
        // Check if already submitted
        const { data: existing } = await supabase
            .from('progress')
            .select('*')
            .eq('student_id', currentUser.id)
            .eq('task_date', today);
        if (existing && existing.length > 0) {
            alert('You already submitted today\'s task!');
            return;
        }
        const score = prompt('After practicing, rate your speaking (1-100):', '70');
        if (score && !isNaN(score) && score >= 1 && score <= 100) {
            const { error } = await supabase.from('progress').insert({
                student_id: currentUser.id,
                task_date: today,
                speaking_score: parseInt(score),
                task_completed: true
            });
            if (error) alert('Error: ' + error.message);
            else {
                alert('✅ Task submitted! Great work!');
                await loadDashboardData();
            }
        } else if (score) alert('Please enter a number between 1 and 100');
    }

    // ---------- UI ----------
    function showDashboard() {
        document.getElementById('authContainer').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('userEmail').textContent = currentUser?.email || '';
    }

    function showAuth() {
        document.getElementById('authContainer').style.display = 'flex';
        document.getElementById('dashboard').style.display = 'none';
    }

    async function checkSession() {
        const { data: { user } } = await supabase.auth.getUser();
        if (user) {
            currentUser = user;
            showDashboard();
            await loadDashboardData();
        } else {
            showAuth();
        }
    }

    // ---------- Event Listeners ----------
    document.getElementById('authButton').onclick = async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        if (!email || !password) { showError('Please enter email and password'); return; }
        if (isLogin) await signIn(email, password);
        else {
            const ok = await signUp(email, password);
            if (ok) {
                // Switch to login mode after signup
                isLogin = true;
                document.getElementById('authTitle').innerText = 'Welcome to IELTS Immersion';
                document.getElementById('toggleAuth').innerHTML = 'Don\'t have an account? Create one →';
                document.getElementById('authButton').innerText = 'Sign In';
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
            }
        }
    };

    document.getElementById('toggleAuth').onclick = () => {
        isLogin = !isLogin;
        document.getElementById('authTitle').innerText = isLogin ? 'Welcome to IELTS Immersion' : 'Create Your Account';
        document.getElementById('toggleAuth').innerHTML = isLogin ? 'Don\'t have an account? Create one →' : 'Already have an account? Sign in →';
        document.getElementById('authButton').innerText = isLogin ? 'Sign In' : 'Create Account';
    };

    document.getElementById('logoutBtn').onclick = signOut;

    // Expose submitTask to global scope for button click
    window.submitTask = submitTask;

    checkSession();
</script>
</body>
</html>
