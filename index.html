<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>IELTS Student · Daily Tasks</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            padding: 1.5rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: #1e293b;
            border-radius: 28px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, #facc15, #fbbf24);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.25rem;
        }

        h2 {
            font-size: 1.3rem;
            font-weight: 500;
            margin-bottom: 1rem;
            color: #facc15;
        }

        /* top bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }
        .avatar-container {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .avatar-clickable {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            border: 2px solid #facc15;
            transition: transform 0.1s;
        }
        .avatar-clickable img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .avatar-initials {
            font-weight: bold;
            font-size: 1.2rem;
            color: #facc15;
        }
        .btn-secondary {
            background: #475569;
            color: #f1f5f9;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            border: none;
            cursor: pointer;
        }

        /* leaderboard */
        .leaderboard-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 1rem;
            align-items: end;
            margin-bottom: 1.5rem;
        }
        .podium-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 1rem 0.8rem;
            text-align: center;
        }
        .podium-card.first {
            background: linear-gradient(160deg, rgba(250,204,21,0.15), #1e293b);
            border-color: #facc15;
            padding-top: 1.5rem;
        }
        .podium-avatar {
            width: 56px;
            height: 56px;
            background: #334155;
            border-radius: 50%;
            margin: 0 auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .podium-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .first .podium-avatar {
            width: 70px;
            height: 70px;
        }
        .lb-list {
            background: #1e293b;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 1rem;
        }
        .lb-header, .lb-row {
            display: grid;
            grid-template-columns: 60px 1fr 100px;
            padding: 0.8rem 1rem;
            border-bottom: 1px solid #334155;
        }
        .lb-header {
            background: #0f172a;
            font-weight: 600;
            color: #94a3b8;
            font-size: 0.75rem;
            text-transform: uppercase;
        }
        .lb-name {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .lb-avatar {
            width: 32px;
            height: 32px;
            background: #334155;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .lb-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .lb-score {
            text-align: right;
            font-weight: 700;
            color: #facc15;
        }

        /* date strip */
        .date-strip {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            scrollbar-width: thin;
        }
        .date-chip {
            flex-shrink: 0;
            background: #334155;
            border: 1px solid #475569;
            border-radius: 40px;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: #cbd5e1;
        }
        .date-chip:hover, .date-chip.active {
            background: #facc15;
            color: #0f172a;
            border-color: #facc15;
        }
        .date-chip.has-task {
            border-left: 3px solid #10b981;
        }
        .date-picker-wrapper {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .date-picker-wrapper input {
            flex: 2;
            padding: 0.6rem;
            border-radius: 40px;
            background: #334155;
            border: 1px solid #475569;
            color: white;
        }

        /* task card */
        .task-card {
            background: #334155;
            border-radius: 20px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .task-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #facc15;
        }
        .task-skill {
            display: inline-block;
            background: #1e293b;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.7rem;
        }
        .complete-btn, .start-task-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            cursor: pointer;
        }
        .start-task-btn {
            background: #facc15;
            color: #0f172a;
        }
        .completed-badge {
            background: #10b981;
            color: white;
            padding: 0.3rem 0.9rem;
            border-radius: 40px;
            font-size: 0.75rem;
        }
        .alert {
            padding: 0.8rem 1rem;
            background: #2d3748;
            color: #facc15;
            border-radius: 16px;
        }

        /* modal for external task */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e293b;
            border-radius: 28px;
            max-width: 1000px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 1.5rem;
            position: relative;
        }
        .task-iframe {
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 16px;
            background: white;
            margin-top: 1rem;
        }
        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: #475569;
            border: none;
            color: white;
            font-size: 1.2rem;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
        }

        .auth-links {
            margin-top: 1rem;
            text-align: center;
        }
        .auth-links a {
            color: #facc15;
            cursor: pointer;
        }
        @media (max-width: 780px) {
            .leaderboard-grid {
                grid-template-columns: 1fr;
            }
            .podium-card.first {
                order: -1;
            }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- AUTH CARD -->
    <div id="authCard" class="card">
        <h1>📚 IELTS Daily</h1>
        <p style="margin-bottom: 1.2rem;">Student · Daily Tasks</p>
        <input type="email" id="email" placeholder="Email address" style="width:100%; padding:0.6rem; margin-bottom:0.8rem; border-radius:40px;">
        <input type="password" id="password" placeholder="Password" style="width:100%; padding:0.6rem; margin-bottom:0.8rem; border-radius:40px;">
        <button id="loginBtn" style="width:100%; padding:0.6rem; border-radius:40px; background:#facc15; font-weight:bold;">Sign In</button>
        <div class="auth-links">
            <a id="showSignupBtn">Create account</a> &nbsp;|&nbsp;
            <a id="showResetBtn">Forgot password?</a>
        </div>
        <div id="authMsg" style="margin-top: 1rem; font-size: 0.8rem;"></div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" style="display: none;">
        <!-- Leaderboard Card -->
        <div class="card">
            <h2>🏆 Leaderboard (Avg Score)</h2>
            <div id="leaderboardContainer"></div>
        </div>

        <!-- Tasks Card -->
        <div class="card">
            <div class="top-bar">
                <h1>📖 Daily Tasks</h1>
                <div class="avatar-container">
                    <div class="avatar-clickable" id="avatarBtn" title="Change avatar">
                        <span id="avatarInitials" class="avatar-initials">?</span>
                    </div>
                    <button id="logoutBtn" class="btn-secondary">Sign Out</button>
                </div>
            </div>
            <div class="date-strip" id="dateStrip"></div>
            <div class="date-picker-wrapper">
                <input type="date" id="datePicker">
                <button id="loadTasksBtn" style="padding:0.5rem 1rem; border-radius:40px; background:#facc15;">Load Tasks</button>
            </div>
            <div id="taskList"></div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://wqoshwbtxulnlfccbuvi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indxb3Nod2J0eHVsbmxmY2NidXZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0ODAwMTgsImV4cCI6MjA5MzA1NjAxOH0.ChxkoIlruVPtontdf0_uvG__XSpZdVhScxR1f-F_ArA';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null;
    let taskDates = new Set();

    // Helper
    function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }

    // ========== AVATAR ==========
    async function updateAvatarDisplay() {
        if (!currentUser) return;
        let avatarUrl = currentUser.user_metadata?.avatar_url || null;
        const avatarBtn = document.getElementById('avatarBtn');
        if (avatarUrl) {
            avatarBtn.innerHTML = `<img src="${avatarUrl}" style="width:100%;height:100%;object-fit:cover">`;
        } else {
            const name = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
            const initials = name.charAt(0).toUpperCase();
            avatarBtn.innerHTML = `<span class="avatar-initials">${initials}</span>`;
        }
    }

    async function uploadAvatar(file) {
        if (!file) return;
        const fileExt = file.name.split('.').pop();
        const fileName = `${currentUser.id}/avatar.${fileExt}`;
        const { error: uploadError } = await sb.storage.from('avatars').upload(fileName, file, { upsert: true });
        if (uploadError) { alert("Upload error: " + uploadError.message); return; }
        const { data: urlData } = sb.storage.from('avatars').getPublicUrl(fileName);
        const avatarUrl = urlData.publicUrl + '?t=' + Date.now();
        await sb.auth.updateUser({ data: { avatar_url: avatarUrl } });
        await sb.from('task_completions').update({ user_avatar: avatarUrl }).eq('user_id', currentUser.id);
        const { data: { user } } = await sb.auth.getUser();
        currentUser = user;
        await updateAvatarDisplay();
        await renderLeaderboard();
        alert("Avatar updated!");
    }

    function openAvatarPicker() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = (e) => uploadAvatar(e.target.files[0]);
        input.click();
    }

    // ========== LEADERBOARD ==========
    async function renderLeaderboard() {
        const { data: completions } = await sb.from('task_completions').select('user_id, user_name, user_avatar, score');
        if (!completions || completions.length === 0) {
            document.getElementById('leaderboardContainer').innerHTML = `<div class="alert">📭 No scores yet.</div>`;
            return;
        }
        const userMap = new Map();
        for (const c of completions) {
            if (c.score === null) continue;
            if (!userMap.has(c.user_id)) {
                userMap.set(c.user_id, { name: c.user_name || 'Student', avatar: c.user_avatar, scores: [] });
            }
            userMap.get(c.user_id).scores.push(c.score);
        }
        let leaderboard = Array.from(userMap.entries()).map(([uid, d]) => ({
            user_id: uid, name: d.name, avatar: d.avatar,
            avgScore: Math.round(d.scores.reduce((a,b)=>a+b,0)/d.scores.length)
        })).sort((a,b) => b.avgScore - a.avgScore);
        if (leaderboard.length === 0) {
            document.getElementById('leaderboardContainer').innerHTML = `<div class="alert">📭 No valid scores.</div>`;
            return;
        }
        const top3 = leaderboard.slice(0,3);
        const podiumHtml = `
            <div class="leaderboard-grid">
                ${top3[1] ? `<div class="podium-card second"><div class="podium-avatar">${top3[1].avatar ? `<img src="${top3[1].avatar}">` : (top3[1].name.charAt(0)||'?')}</div><div>${escapeHtml(top3[1].name)}</div><div style="font-size:1.5rem;font-weight:bold;color:#facc15;">${top3[1].avgScore}%</div></div>` : '<div></div>'}
                ${top3[0] ? `<div class="podium-card first"><div class="podium-avatar" style="width:70px;height:70px;">${top3[0].avatar ? `<img src="${top3[0].avatar}">` : (top3[0].name.charAt(0)||'?')}</div><div>${escapeHtml(top3[0].name)}</div><div style="font-size:1.8rem;font-weight:bold;color:#facc15;">${top3[0].avgScore}%</div></div>` : '<div></div>'}
                ${top3[2] ? `<div class="podium-card third"><div class="podium-avatar">${top3[2].avatar ? `<img src="${top3[2].avatar}">` : (top3[2].name.charAt(0)||'?')}</div><div>${escapeHtml(top3[2].name)}</div><div style="font-size:1.5rem;font-weight:bold;color:#facc15;">${top3[2].avgScore}%</div></div>` : '<div></div>'}
            </div>
            <div class="lb-list"><div class="lb-header"><div>Rank</div><div>Student</div><div>Avg Score</div></div>
            ${leaderboard.map((u, i) => `<div class="lb-row"><div>${i+1}</div><div class="lb-name"><div class="lb-avatar">${u.avatar ? `<img src="${u.avatar}">` : (u.name.charAt(0)||'?')}</div><span>${escapeHtml(u.name)}${u.user_id === currentUser?.id ? ' <span style="font-size:0.7rem;color:#facc15;">(You)</span>' : ''}</span></div><div class="lb-score">${u.avgScore}%</div></div>`).join('')}
            </div>
        `;
        document.getElementById('leaderboardContainer').innerHTML = podiumHtml;
    }

    // ========== DATE STRIP ==========
    async function loadAllTaskDates() {
        const { data: tasks } = await sb.from('tasks').select('task_date');
        taskDates.clear();
        (tasks || []).forEach(t => taskDates.add(t.task_date));
    }

    function buildDateStrip(selectedDate) {
        const today = new Date();
        let chips = [];
        for (let i = -7; i <= 7; i++) {
            const d = new Date(today);
            d.setDate(today.getDate() + i);
            const dateStr = d.toISOString().slice(0,10);
            const display = `${d.getDate()} ${d.toLocaleString('default',{month:'short'})}`;
            chips.push({ dateStr, display, hasTask: taskDates.has(dateStr), active: dateStr === selectedDate });
        }
        const strip = document.getElementById('dateStrip');
        strip.innerHTML = chips.map(c => `<div class="date-chip ${c.active ? 'active' : ''} ${c.hasTask ? 'has-task' : ''}" data-date="${c.dateStr}">${c.display}</div>`).join('');
        document.querySelectorAll('.date-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                const newDate = chip.dataset.date;
                document.getElementById('datePicker').value = newDate;
                loadTasksForDate(newDate);
                document.querySelectorAll('.date-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
            });
        });
    }

    // ========== TASKS (with external HTML support) ==========
    async function loadTasksForDate(date) {
        if (!date) return;
        const taskListDiv = document.getElementById('taskList');
        taskListDiv.innerHTML = '<div class="alert">⏳ Loading tasks...</div>';
        const { data: tasks, error } = await sb.from('tasks').select('*').eq('task_date', date);
        if (error) { taskListDiv.innerHTML = `<div class="alert">❌ ${error.message}</div>`; return; }
        if (!tasks.length) { taskListDiv.innerHTML = '<div class="alert">📭 No tasks for this date.</div>'; return; }

        // Get user completions
        const { data: completions } = await sb.from('task_completions').select('task_id, score').eq('user_id', currentUser.id);
        const completedMap = new Map((completions||[]).map(c => [c.task_id, c.score]));

        taskListDiv.innerHTML = tasks.map(task => {
            const completed = completedMap.has(task.id);
            const score = completedMap.get(task.id);
            const external = task.external_html_url && task.external_html_url.trim().length > 0;
            return `
                <div class="task-card">
                    <div class="task-skill">${task.skill || 'General'}</div>
                    <div class="task-title">${escapeHtml(task.title)}</div>
                    ${task.description ? `<div style="font-size:0.85rem; color:#cbd5e1; margin-top:0.3rem;">${escapeHtml(task.description.substring(0,150))}${task.description.length>150?'…':''}</div>` : ''}
                    <div style="margin-top:0.6rem;">
                        ${completed ? `<span class="completed-badge">✅ Completed (${score}%)</span>` :
                        (external ? `<button class="start-task-btn" data-task-id="${task.id}" data-task-url="${escapeHtml(task.external_html_url)}">🎯 Start Task</button>` :
                                   `<button class="complete-btn" data-task-id="${task.id}">✓ Mark as Completed</button>`)}
                    </div>
                </div>
            `;
        }).join('');

        // Attach handlers for manual completion
        document.querySelectorAll('.complete-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const taskId = btn.dataset.taskId;
                const score = prompt("Enter your score (0-100):", "75");
                if (score === null) return;
                const num = parseInt(score);
                if (isNaN(num) || num < 0 || num > 100) { alert("Score must be 0-100"); return; }
                const { error } = await sb.from('task_completions').insert({
                    task_id: taskId, user_id: currentUser.id, score: num,
                    user_name: currentUser.user_metadata?.full_name || currentUser.email.split('@')[0],
                    user_avatar: currentUser.user_metadata?.avatar_url || null,
                    completed_at: new Date().toISOString()
                });
                if (error) alert("Error: " + error.message);
                else { alert(`✅ Score ${num}% saved!`); loadTasksForDate(date); renderLeaderboard(); }
            });
        });

        // Attach handlers for external tasks (open modal)
        document.querySelectorAll('.start-task-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const taskId = btn.dataset.taskId;
                const taskUrl = btn.dataset.taskUrl;
                openExternalTask(taskId, taskUrl, date);
            });
        });
    }

    // Modal for external task (iframe)
    let currentModal = null;
    function openExternalTask(taskId, taskUrl, currentDate) {
        // close any existing modal
        if (currentModal) currentModal.remove();
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.innerHTML = `
            <div class="modal-content">
                <button class="modal-close">✕</button>
                <h3 style="margin-bottom:0.5rem;">📝 Task</h3>
                <iframe class="task-iframe" src="${escapeHtml(taskUrl)}" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals"></iframe>
                <p style="font-size:0.8rem; margin-top:0.5rem;">Your score will be saved automatically when you finish the task.</p>
            </div>
        `;
        document.body.appendChild(modal);
        currentModal = modal;

        // Close button
        modal.querySelector('.modal-close').addEventListener('click', () => modal.remove());

        // Listen for postMessage from iframe
        const messageHandler = async (event) => {
            if (event.data && event.data.type === 'taskScore') {
                const score = parseInt(event.data.score, 10);
                if (!isNaN(score) && score >= 0 && score <= 100) {
                    // Save score
                    const { error } = await sb.from('task_completions').insert({
                        task_id: taskId, user_id: currentUser.id, score: score,
                        user_name: currentUser.user_metadata?.full_name || currentUser.email.split('@')[0],
                        user_avatar: currentUser.user_metadata?.avatar_url || null,
                        completed_at: new Date().toISOString()
                    });
                    if (error) {
                        alert("Error saving score: " + error.message);
                    } else {
                        alert(`✅ Score ${score}% saved!`);
                        modal.remove();
                        await loadTasksForDate(currentDate);
                        await renderLeaderboard();
                    }
                }
                window.removeEventListener('message', messageHandler);
            }
        };
        window.addEventListener('message', messageHandler);
        // Cleanup when modal is closed
        const observer = new MutationObserver(() => {
            if (!document.body.contains(modal)) {
                window.removeEventListener('message', messageHandler);
                observer.disconnect();
            }
        });
        observer.observe(document.body, { childList: true, subtree: true });
    }

    // ========== AUTH ==========
    async function login() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        if (!email || !password) { showAuthMessage('Enter email and password'); return; }
        const btn = document.getElementById('loginBtn'); btn.disabled = true; btn.textContent = 'Signing in...';
        const { error } = await sb.auth.signInWithPassword({ email, password });
        btn.disabled = false; btn.textContent = 'Sign In';
        if (error) showAuthMessage(error.message);
    }
    async function logout() { await sb.auth.signOut(); }
    async function signup() {
        const email = prompt("Enter email:");
        if (!email) return;
        const pass = prompt("Password (min 6 chars):");
        if (!pass || pass.length<6) { alert("Password too short"); return; }
        const name = prompt("Full name (optional):", email.split('@')[0]);
        const { error } = await sb.auth.signUp({ email, password: pass, options: { data: { full_name: name } } });
        if (error) alert(error.message);
        else alert("Account created! Please check email to confirm.");
    }
    async function resetPassword() {
        const email = prompt("Enter your email:");
        if (!email) return;
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });
        if (error) alert(error.message);
        else alert("Reset link sent!");
    }
    function showAuthMessage(msg) {
        const d = document.getElementById('authMsg');
        d.innerHTML = `<div style="background:#7f1a1a;padding:0.6rem;border-radius:12px;">${msg}</div>`;
        setTimeout(() => d.innerHTML = '', 4000);
    }

    async function updateUIForUser(user) {
        if (user) {
            currentUser = user;
            document.getElementById('authCard').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            await loadAllTaskDates();
            const today = new Date().toISOString().slice(0,10);
            document.getElementById('datePicker').value = today;
            await loadTasksForDate(today);
            await renderLeaderboard();
            buildDateStrip(today);
            await updateAvatarDisplay();
            document.getElementById('avatarBtn').addEventListener('click', openAvatarPicker);
        } else {
            currentUser = null;
            document.getElementById('authCard').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
        }
    }

    sb.auth.onAuthStateChange((event, session) => updateUIForUser(session?.user || null));
    (async () => {
        const { data: { user } } = await sb.auth.getUser();
        await updateUIForUser(user);
    })();

    document.getElementById('loginBtn').addEventListener('click', login);
    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('loadTasksBtn').addEventListener('click', () => {
        const date = document.getElementById('datePicker').value;
        if (date) loadTasksForDate(date);
    });
    document.getElementById('datePicker').addEventListener('change', (e) => {
        const date = e.target.value;
        if (date) {
            loadTasksForDate(date);
            buildDateStrip(date);
        }
    });
    document.getElementById('showSignupBtn').addEventListener('click', signup);
    document.getElementById('showResetBtn').addEventListener('click', resetPassword);
</script>
</body>
</html>
