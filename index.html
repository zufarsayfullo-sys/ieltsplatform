<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Daily - Student Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #f59e0b;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }

        /* AUTH SECTION */
        #auth-screen { display: flex; align-items: center; justify-content: center; min-height: 90vh; }
        .auth-card { background: var(--surface); padding: 32px 24px; border-radius: var(--radius); border: 1px solid var(--border); width: 100%; max-width: 400px; text-align: center; }
        
        /* DASHBOARD HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; padding: 20px; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); }
        .user-profile { display: flex; align-items: center; gap: 15px; }
        .avatar-container { 
            width: 50px; height: 50px; border-radius: 50%; background: var(--primary); 
            display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; cursor: pointer; border: 2px solid var(--border);
        }
        .avatar-container img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-upload-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.2s; font-size: 10px; color: white; }
        .avatar-container:hover .avatar-upload-overlay { opacity: 1; }

        /* TASK & LEADERBOARD */
        .task-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
        .leaderboard-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-top: 32px; }
        .leaderboard-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
        
        /* BUTTONS */
        .btn-primary { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 600; }
        input { width: 100%; padding: 12px; margin-bottom: 16px; background: var(--bg); border: 1px solid var(--border); color: white; border-radius: 8px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="auth-screen">
        <div class="auth-card">
            <h2>IELTS Daily</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button class="btn-primary" onclick="handleLogin()">Sign In</button>
        </div>
    </div>

    <div id="main-dashboard" class="hidden">
        <div class="header">
            <div class="user-profile">
                <div class="avatar-container" onclick="document.getElementById('avatarInput').click()">
                    <div id="avatar-preview">?</div>
                    <div class="avatar-upload-overlay">Upload</div>
                </div>
                <input type="file" id="avatarInput" class="hidden" accept="image/*" onchange="uploadAvatar(this)">
                <h2 id="display-name">Student</h2>
            </div>
            <button onclick="location.reload()" style="background:none; border:none; color:white; cursor:pointer;">Logout</button>
        </div>

        <h3>Today's Tasks</h3>
        <div id="task-list"></div>

        <div class="leaderboard-card">
            <h3>Top Performers</h3>
            <div id="leaderboard-content"></div>
        </div>
    </div>
</div>

<script>
    // --- CONNECTIONS ---
    const SB_URL = 'https://your-project-url.supabase.co'; //
    const SB_KEY = 'your-anon-key'; //
    const sb = supabase.createClient(SB_URL, SB_KEY); //

    let userSession = null;

    // --- FUNCTIONS ---
    async function handleLogin() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { data, error } = await sb.auth.signInWithPassword({ email, password }); //

        if (error) return alert(error.message);
        userSession = data.user;
        initDashboard();
    }

    async function initDashboard() {
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('main-dashboard').classList.remove('hidden');
        
        const { data: profile } = await sb.from('profiles').select('*').eq('id', userSession.id).single(); //
        if (profile) {
            document.getElementById('display-name').textContent = profile.full_name;
            if (profile.avatar_url) {
                document.getElementById('avatar-preview').innerHTML = `<img src="${profile.avatar_url}">`;
            }
        }
        loadTasks();
        loadLeaderboard();
    }

    async function loadTasks() {
        const { data: tasks } = await sb.from('tasks').select('*'); //
        const container = document.getElementById('task-list');
        container.innerHTML = tasks ? tasks.map(t => `
            <div class="task-card">
                <h4>${t.title}</h4>
                <p>${t.description}</p>
                <button class="btn-primary" style="margin-top:10px" onclick="markComplete('${t.id}')">Complete</button>
            </div>
        `).join('') : '<p>No tasks.</p>';
    }

    async function markComplete(taskId) {
        const { error } = await sb.from('task_submissions').insert([{ task_id: taskId, student_id: userSession.id }]); //
        if (!error) {
            alert("Done!");
            loadLeaderboard();
        }
    }

    async function loadLeaderboard() {
        const { data } = await sb.from('profiles').select('full_name, total_score, avatar_url').order('total_score', { ascending: false }).limit(5); //
        const content = document.getElementById('leaderboard-content');
        if (data) {
            content.innerHTML = data.map((u, i) => `
                <div class="leaderboard-item">
                    <span>#${i+1} ${u.full_name}</span>
                    <span style="color:var(--accent); font-weight:bold;">${u.total_score || 0} XP</span>
                </div>
            `).join('');
        }
    }

    async function uploadAvatar(input) {
        const file = input.files[0];
        const path = `avatars/${userSession.id}`;
        const { error: uploadError } = await sb.storage.from('avatars').upload(path, file, { upsert: true }); //
        
        if (!uploadError) {
            const { data: { publicUrl } } = sb.storage.from('avatars').getPublicUrl(path); //
            await sb.from('profiles').update({ avatar_url: publicUrl }).eq('id', userSession.id); //
            location.reload();
        }
    }
</script>
</body>
</html>
