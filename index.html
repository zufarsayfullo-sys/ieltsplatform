<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Platform</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: Arial; margin: 0; background:#f4f6f8; }
    header { background:#111827; color:white; padding:15px; text-align:center; }

    .container { max-width:900px; margin:auto; padding:20px; }

    .card {
      background:white; padding:15px; margin:10px 0;
      border-radius:10px; box-shadow:0 2px 5px rgba(0,0,0,0.1);
      cursor:pointer;
    }

    input, button {
      padding:10px; margin:5px 0; width:100%;
    }

    button { cursor:pointer; }

    .row { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  </style>
</head>

<body>

<header>
  <h2>Student Practice Platform</h2>
</header>

<div class="container">

  <!-- AUTH -->
  <div id="auth">
    <h3>Login / Signup</h3>
    <input id="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />
    <button onclick="signup()">Sign Up</button>
    <button onclick="login()">Login</button>
  </div>

  <!-- APP -->
  <div id="app" style="display:none;">

    <button onclick="logout()">Logout</button>

    <div class="row">

      <!-- TASKS -->
      <div>
        <h3>Today’s Tasks</h3>
        <div id="tasks"></div>
      </div>

      <!-- LEADERBOARD -->
      <div>
        <h3>Leaderboard</h3>
        <div id="board"></div>
      </div>

    </div>
  </div>

</div>

<script>
  // 🔑 PASTE YOUR SUPABASE KEYS HERE
  const SUPABASE_URL = "YOUR_SUPABASE_URL";
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ---------- AUTH ----------
  async function signup() {
    const email = emailEl().value;
    const password = passEl().value;

    await supabase.auth.signUp({ email, password });
    alert("Check your email to confirm signup");
  }

  async function login() {
    const email = emailEl().value;
    const password = passEl().value;

    const { error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (!error) loadApp();
    else alert(error.message);
  }

  async function logout() {
    await supabase.auth.signOut();
    location.reload();
  }

  function emailEl() { return document.getElementById("email"); }
  function passEl() { return document.getElementById("password"); }

  // ---------- LOAD APP ----------
  async function loadApp() {
    document.getElementById("auth").style.display = "none";
    document.getElementById("app").style.display = "block";

    loadTasks();
    loadLeaderboard();
  }

  // ---------- TASKS ----------
  async function loadTasks() {
    const today = new Date().toISOString().split("T")[0];

    const { data } = await supabase
      .from("tasks")
      .select("*")
      .eq("date", today);

    const container = document.getElementById("tasks");
    container.innerHTML = "";

    data.forEach(t => {
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `<b>${t.title}</b><br>${t.type}`;

      div.onclick = () => {
        window.location.href = "task.html?id=" + t.id;
      };

      container.appendChild(div);
    });
  }

  // ---------- LEADERBOARD ----------
  async function loadLeaderboard() {
    const { data } = await supabase
      .from("scores")
      .select("*")
      .order("points", { ascending: false });

    const container = document.getElementById("board");
    container.innerHTML = "";

    data.forEach((u, i) => {
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `#${i+1} User: ${u.user_id} — ${u.points} pts`;
      container.appendChild(div);
    });
  }

  // auto session check
  supabase.auth.getSession().then(({ data }) => {
    if (data.session) loadApp();
  });

</script>

</body>
</html>
