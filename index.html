<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>IELTS Student · Daily Tasks + Leaderboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            padding: 1.5rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* cards */
        .card {
            background: #1e293b;
            border-radius: 28px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, #facc15, #fbbf24);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.25rem;
        }

        h2 {
            font-size: 1.3rem;
            font-weight: 500;
            margin-bottom: 1rem;
            color: #facc15;
        }

        h3 {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: #e2e8f0;
        }

        /* inputs & buttons */
        input, button {
            font-family: inherit;
            border-radius: 16px;
            border: none;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        input {
            background: #334155;
            color: #f1f5f9;
            border: 1px solid #475569;
            width: 100%;
            margin-bottom: 0.8rem;
        }

        input:focus {
            outline: none;
            border-color: #facc15;
            box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.2);
        }

        button {
            background: #facc15;
            color: #0f172a;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        button:hover {
            background: #eab308;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #475569;
            color: #f1f5f9;
        }
        .btn-secondary:hover {
            background: #334155;
        }

        /* task cards */
        .task-card {
            background: #334155;
            border-radius: 20px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            transition: all 0.2s;
            border: 1px solid #475569;
        }

        .task-card:hover {
            background: #3b4252;
            transform: translateX(4px);
        }

        .task-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #facc15;
            margin-bottom: 0.3rem;
        }

        .task-skill {
            display: inline-block;
            background: #1e293b;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
            margin-bottom: 0.6rem;
        }

        .task-desc {
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .completed-badge {
            background: #10b981;
            color: white;
            display: inline-block;
            padding: 0.3rem 0.9rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        button.complete-btn {
            background: #10b981;
            color: white;
            margin-top: 0.5rem;
            width: auto;
            padding: 0.5rem 1.2rem;
        }

        button.complete-btn:hover {
            background: #059669;
        }

        /* leaderboard */
        .leaderboard-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 1rem;
            align-items: end;
            margin-bottom: 1.5rem;
        }
        .podium-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 1rem 0.8rem;
            text-align: center;
        }
        .podium-card.first {
            background: linear-gradient(160deg, rgba(250,204,21,0.15), #1e293b);
            border-color: #facc15;
            padding-top: 1.5rem;
        }
        .podium-avatar {
            width: 56px;
            height: 56px;
            background: #334155;
            border-radius: 50%;
            margin: 0 auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .first .podium-avatar {
            width: 70px;
            height: 70px;
        }
        .lb-list {
            background: #1e293b;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 1rem;
        }
        .lb-header, .lb-row {
            display: grid;
            grid-template-columns: 60px 1fr 100px;
            padding: 0.8rem 1rem;
            border-bottom: 1px solid #334155;
        }
        .lb-header {
            background: #0f172a;
            font-weight: 600;
            color: #94a3b8;
            font-size: 0.75rem;
            text-transform: uppercase;
        }
        .lb-rank {
            font-weight: 600;
        }
        .lb-name {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .lb-avatar {
            width: 32px;
            height: 32px;
            background: #334155;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .lb-score {
            text-align: right;
            font-weight: 700;
            color: #facc15;
        }
        .date-picker-wrapper {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }
        .date-picker-wrapper input {
            flex: 2;
            margin-bottom: 0;
        }
        .alert {
            padding: 0.8rem 1rem;
            border-radius: 16px;
            background: #2d3748;
            color: #facc15;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }
        .auth-links {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.85rem;
        }
        .auth-links a {
            color: #facc15;
            text-decoration: none;
            cursor: pointer;
        }
        .auth-links a:hover {
            text-decoration: underline;
        }
        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #64748b;
        }
        @media (max-width: 780px) {
            .leaderboard-grid {
                grid-template-columns: 1fr;
                gap: 0.8rem;
            }
            .podium-card.first {
                order: -1;
            }
        }
        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }
            .card {
                padding: 1.2rem;
            }
            .lb-header, .lb-row {
                grid-template-columns: 50px 1fr 80px;
            }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- AUTH CARD (login) -->
    <div id="authCard" class="card">
        <h1>📚 IELTS Daily</h1>
        <p style="margin-bottom: 1.2rem; color: #94a3b8;">Student · Daily Tasks</p>
        <input type="email" id="email" placeholder="Email address" autocomplete="email">
        <input type="password" id="password" placeholder="Password" autocomplete="current-password">
        <button id="loginBtn" style="width: 100%;">Sign In</button>
        <div class="auth-links">
            <a id="showSignupBtn">Create account</a> &nbsp;|&nbsp;
            <a id="showResetBtn">Forgot password?</a>
        </div>
        <div id="authMsg" style="margin-top: 1rem; font-size: 0.8rem;"></div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" style="display: none;">
        <!-- Leaderboard Card -->
        <div class="card">
            <h2>🏆 Leaderboard (Avg Score)</h2>
            <div id="leaderboardContainer">
                <div class="alert">Loading leaderboard...</div>
            </div>
        </div>

        <!-- Tasks Card -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem;">
                <h1>📖 Daily Tasks</h1>
                <button id="logoutBtn" class="btn-secondary" style="padding: 0.4rem 1rem;">Sign Out</button>
            </div>
            <div class="date-picker-wrapper">
                <input type="date" id="datePicker">
                <button id="loadTasksBtn">Load Tasks</button>
            </div>
            <div id="taskList">
                <div class="alert">⬅️ Select a date and click “Load Tasks”</div>
            </div>
        </div>
    </div>

    <footer>© IELTS Daily — keep practicing</footer>
</div>

<script>
    const SUPABASE_URL = 'https://wqoshwbtxulnlfccbuvi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indxb3Nod2J0eHVsbmxmY2NidXZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0ODAwMTgsImV4cCI6MjA5MzA1NjAxOH0.ChxkoIlruVPtontdf0_uvG__XSpZdVhScxR1f-F_ArA';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null;

    // DOM elements
    const authCard = document.getElementById('authCard');
    const dashboard = document.getElementById('dashboard');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const loadTasksBtn = document.getElementById('loadTasksBtn');
    const datePicker = document.getElementById('datePicker');
    const taskListDiv = document.getElementById('taskList');
    const authMsgDiv = document.getElementById('authMsg');
    const leaderboardContainer = document.getElementById('leaderboardContainer');

    // Helper: show auth message
    function showAuthMessage(msg, isError = true) {
        authMsgDiv.innerHTML = `<div style="background: ${isError ? '#7f1a1a' : '#14532d'}; padding: 0.6rem; border-radius: 12px;">${msg}</div>`;
        setTimeout(() => { if (authMsgDiv) authMsgDiv.innerHTML = ''; }, 4000);
    }

    // Escape HTML
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // ========== LEADERBOARD (average score) ==========
    async function renderLeaderboard() {
        // Fetch all completions with scores
        const { data: completions, error } = await sb.from('task_completions').select('user_id, user_name, user_avatar, score');
        if (error) {
            leaderboardContainer.innerHTML = `<div class="alert">❌ Could not load leaderboard</div>`;
            return;
        }
        if (!completions || completions.length === 0) {
            leaderboardContainer.innerHTML = `<div class="alert">📭 No scores yet. Complete tasks to appear!</div>`;
            return;
        }

        // Aggregate per user
        const userMap = new Map(); // user_id -> { name, avatar, scores[] }
        for (const c of completions) {
            if (c.score === null || c.score === undefined) continue;
            if (!userMap.has(c.user_id)) {
                userMap.set(c.user_id, {
                    name: c.user_name || 'Student',
                    avatar: c.user_avatar,
                    scores: []
                });
            }
            userMap.get(c.user_id).scores.push(c.score);
        }
        // Calculate average and build array
        let leaderboard = [];
        for (const [userId, data] of userMap.entries()) {
            const avg = data.scores.reduce((a,b)=>a+b,0) / data.scores.length;
            leaderboard.push({
                user_id: userId,
                name: data.name,
                avatar: data.avatar,
                avgScore: Math.round(avg)
            });
        }
        leaderboard.sort((a,b) => b.avgScore - a.avgScore);
        if (leaderboard.length === 0) {
            leaderboardContainer.innerHTML = `<div class="alert">📭 No valid scores yet.</div>`;
            return;
        }

        // Top 3 for podium
        const top3 = leaderboard.slice(0,3);
        const podiumHtml = `
            <div class="leaderboard-grid">
                ${top3[1] ? `
                <div class="podium-card second">
                    <div class="podium-avatar">${top3[1].avatar ? `<img src="${top3[1].avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">` : (top3[1].name.charAt(0) || '?')}</div>
                    <div>${escapeHtml(top3[1].name)}</div>
                    <div style="font-size:1.5rem; font-weight:bold; color:#facc15;">${top3[1].avgScore}%</div>
                    <div style="font-size:0.7rem;">avg score</div>
                </div>
                ` : '<div></div>'}
                ${top3[0] ? `
                <div class="podium-card first">
                    <div class="podium-avatar" style="width:70px;height:70px;">${top3[0].avatar ? `<img src="${top3[0].avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">` : (top3[0].name.charAt(0) || '?')}</div>
                    <div>${escapeHtml(top3[0].name)}</div>
                    <div style="font-size:1.8rem; font-weight:bold; color:#facc15;">${top3[0].avgScore}%</div>
                    <div style="font-size:0.7rem;">avg score</div>
                </div>
                ` : '<div></div>'}
                ${top3[2] ? `
                <div class="podium-card third">
                    <div class="podium-avatar">${top3[2].avatar ? `<img src="${top3[2].avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">` : (top3[2].name.charAt(0) || '?')}</div>
                    <div>${escapeHtml(top3[2].name)}</div>
                    <div style="font-size:1.5rem; font-weight:bold; color:#facc15;">${top3[2].avgScore}%</div>
                    <div style="font-size:0.7rem;">avg score</div>
                </div>
                ` : '<div></div>'}
            </div>
            <div class="lb-list">
                <div class="lb-header"><div>Rank</div><div>Student</div><div>Avg Score</div></div>
                ${leaderboard.map((u, idx) => `
                    <div class="lb-row">
                        <div class="lb-rank">${idx+1}</div>
                        <div class="lb-name">
                            <div class="lb-avatar">${u.avatar ? `<img src="${u.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">` : (u.name.charAt(0) || '?')}</div>
                            <span>${escapeHtml(u.name)}</span>
                            ${u.user_id === currentUser?.id ? ' <span style="font-size:0.7rem;color:#facc15;">(You)</span>' : ''}
                        </div>
                        <div class="lb-score">${u.avgScore}%</div>
                    </div>
                `).join('')}
            </div>
        `;
        leaderboardContainer.innerHTML = podiumHtml;
    }

    // ========== TASKS ==========
    async function loadTasks() {
        const date = datePicker.value;
        if (!date) {
            taskListDiv.innerHTML = '<div class="alert">📅 Please select a date first.</div>';
            return;
        }
        taskListDiv.innerHTML = '<div class="alert">⏳ Loading tasks...</div>';
        const { data: tasks, error } = await sb.from('tasks').select('*').eq('task_date', date);
        if (error) {
            taskListDiv.innerHTML = `<div class="alert">❌ Error: ${error.message}</div>`;
            return;
        }
        if (!tasks || tasks.length === 0) {
            taskListDiv.innerHTML = '<div class="alert">📭 No tasks for this date. Check back later!</div>';
            return;
        }

        // Get completions for current user
        const { data: completions } = await sb.from('task_completions').select('task_id, score').eq('user_id', currentUser.id);
        const completedMap = new Map();
        (completions || []).forEach(c => completedMap.set(c.task_id, c.score));

        let html = '';
        for (const task of tasks) {
            const completed = completedMap.has(task.id);
            const score = completedMap.get(task.id);
            html += `
                <div class="task-card">
                    <div class="task-skill">${task.skill || 'General'}</div>
                    <div class="task-title">${escapeHtml(task.title)}</div>
                    ${task.description ? `<div class="task-desc">${escapeHtml(task.description.substring(0, 200))}${task.description.length > 200 ? '…' : ''}</div>` : ''}
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
                        ${completed ? `<span class="completed-badge">✅ Completed (${score}%)</span>` : `<button class="complete-btn" data-task-id="${task.id}">✓ Mark as Completed</button>`}
                    </div>
                </div>
            `;
        }
        taskListDiv.innerHTML = html;

        // Attach complete button events
        document.querySelectorAll('.complete-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const taskId = btn.dataset.taskId;
                const score = prompt("Enter your score (0-100):", "75");
                if (score === null) return;
                const numScore = parseInt(score);
                if (isNaN(numScore) || numScore < 0 || numScore > 100) {
                    alert("Score must be between 0 and 100");
                    return;
                }
                const { error } = await sb.from('task_completions').insert({
                    task_id: taskId,
                    user_id: currentUser.id,
                    score: numScore,
                    completed_at: new Date().toISOString()
                });
                if (error) {
                    alert("Error: " + error.message);
                } else {
                    alert(`✅ Score ${numScore}% saved!`);
                    await loadTasks();
                    await renderLeaderboard(); // refresh leaderboard
                }
            });
        });
    }

    // ========== AUTH (unchanged working version) ==========
    async function login() {
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        if (!email || !password) {
            showAuthMessage('Please enter email and password');
            return;
        }
        loginBtn.disabled = true;
        loginBtn.textContent = 'Signing in...';
        const { error } = await sb.auth.signInWithPassword({ email, password });
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
        if (error) {
            showAuthMessage(error.message);
        }
    }

    async function logout() {
        await sb.auth.signOut();
    }

    async function signup() {
        const email = prompt("Enter your email address:");
        if (!email) return;
        const password = prompt("Create a password (min 6 characters):");
        if (!password || password.length < 6) {
            alert("Password must be at least 6 characters");
            return;
        }
        const name = prompt("Your full name (optional):", email.split('@')[0]);
        const { error } = await sb.auth.signUp({
            email, password,
            options: { data: { full_name: name || email.split('@')[0] } }
        });
        if (error) alert("Signup error: " + error.message);
        else alert("Account created! Please check your email to confirm (or disable email confirmation in Supabase).");
    }

    async function resetPassword() {
        const email = prompt("Enter your email address to receive a reset link:");
        if (!email) return;
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });
        if (error) alert("Error: " + error.message);
        else alert("Password reset link sent! Check your email.");
    }

    async function updateUIForUser(user) {
        if (user) {
            currentUser = user;
            authCard.style.display = 'none';
            dashboard.style.display = 'block';
            const today = new Date().toISOString().slice(0,10);
            datePicker.value = today;
            await loadTasks();
            await renderLeaderboard();
        } else {
            currentUser = null;
            authCard.style.display = 'block';
            dashboard.style.display = 'none';
            emailInput.value = '';
            passwordInput.value = '';
        }
    }

    // Auth state listener
    sb.auth.onAuthStateChange((event, session) => {
        updateUIForUser(session?.user || null);
    });

    // Initial session check
    (async () => {
        const { data: { user } } = await sb.auth.getUser();
        await updateUIForUser(user);
    })();

    // Event listeners
    loginBtn.addEventListener('click', login);
    logoutBtn.addEventListener('click', logout);
    loadTasksBtn.addEventListener('click', loadTasks);
    document.getElementById('showSignupBtn')?.addEventListener('click', signup);
    document.getElementById('showResetBtn')?.addEventListener('click', resetPassword);
</script>
</body>
</html>
