<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Daily · Simple Tasks</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 1.5rem;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background: #1e293b;
            border-radius: 1.5rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #334155;
        }
        h1, h2 {
            font-weight: 600;
            margin-bottom: 0.75rem;
        }
        h1 {
            font-size: 1.8rem;
            color: #facc15;
        }
        h2 {
            font-size: 1.3rem;
            color: #facc15;
        }
        input, button {
            font-family: inherit;
            border-radius: 2rem;
            border: none;
            padding: 0.6rem 1rem;
            font-size: 0.9rem;
        }
        input {
            background: #334155;
            color: white;
            border: 1px solid #475569;
            width: 100%;
            margin-bottom: 0.8rem;
        }
        button {
            background: #facc15;
            color: #0f172a;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background: #eab308;
        }
        .btn-secondary {
            background: #475569;
            color: white;
        }
        .task-card {
            background: #334155;
            border-radius: 1.2rem;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border: 1px solid #475569;
        }
        .task-title {
            font-weight: 600;
            color: #facc15;
            font-size: 1.1rem;
        }
        .task-skill {
            display: inline-block;
            background: #1e293b;
            padding: 0.2rem 0.7rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            margin-bottom: 0.5rem;
        }
        .completed-badge {
            background: #10b981;
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            display: inline-block;
        }
        .complete-btn {
            background: #10b981;
            color: white;
            padding: 0.3rem 1rem;
        }
        .leaderboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .podium-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 1rem;
            padding: 0.8rem;
            text-align: center;
        }
        .podium-card.first {
            background: linear-gradient(160deg, rgba(250,204,21,0.15), #1e293b);
            border-color: #facc15;
        }
        .podium-avatar {
            width: 50px;
            height: 50px;
            background: #334155;
            border-radius: 50%;
            margin: 0 auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .first .podium-avatar {
            width: 65px;
            height: 65px;
        }
        .lb-list {
            background: #1e293b;
            border-radius: 1rem;
            overflow: hidden;
        }
        .lb-row {
            display: grid;
            grid-template-columns: 50px 1fr 80px;
            padding: 0.6rem 1rem;
            border-bottom: 1px solid #334155;
        }
        .lb-score {
            text-align: right;
            font-weight: 600;
            color: #facc15;
        }
        .date-strip {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            margin-bottom: 1rem;
        }
        .date-chip {
            background: #334155;
            border: 1px solid #475569;
            border-radius: 2rem;
            padding: 0.4rem 1rem;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .date-chip.active {
            background: #facc15;
            color: #0f172a;
        }
        .date-chip.has-task {
            border-left: 3px solid #10b981;
        }
        .date-picker-wrapper {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .date-picker-wrapper input {
            flex: 2;
            margin-bottom: 0;
        }
        .alert {
            padding: 0.8rem;
            background: #2d3748;
            border-radius: 1rem;
            color: #facc15;
        }
        .auth-links {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.8rem;
        }
        .auth-links a {
            color: #facc15;
            cursor: pointer;
        }
        @media (max-width: 700px) {
            .leaderboard-grid {
                grid-template-columns: 1fr;
            }
            .podium-card.first {
                order: -1;
            }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- AUTH CARD -->
    <div id="authCard" class="card">
        <h1>📚 IELTS Daily</h1>
        <p>Student · Simple Tasks</p>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button id="loginBtn" style="width:100%">Sign In</button>
        <div class="auth-links">
            <a id="showSignupBtn">Create account</a> | <a id="showResetBtn">Forgot password?</a>
        </div>
        <div id="authMsg" style="margin-top:0.8rem;"></div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" style="display:none">
        <div class="card">
            <h2>🏆 Leaderboard (Avg Score)</h2>
            <div id="leaderboardContainer"><div class="alert">Loading...</div></div>
        </div>
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <h1>📖 Tasks</h1>
                <button id="logoutBtn" class="btn-secondary">Sign Out</button>
            </div>
            <div class="date-strip" id="dateStrip"></div>
            <div class="date-picker-wrapper">
                <input type="date" id="datePicker">
                <button id="loadTasksBtn">Load Tasks</button>
            </div>
            <div id="taskList"><div class="alert">Select a date and click Load Tasks</div></div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://wqoshwbtxulnlfccbuvi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indxb3Nod2J0eHVsbmxmY2NidXZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0ODAwMTgsImV4cCI6MjA5MzA1NjAxOH0.ChxkoIlruVPtontdf0_uvG__XSpZdVhScxR1f-F_ArA';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null;
    let taskDatesSet = new Set();

    // DOM refs
    const authCard = document.getElementById('authCard');
    const dashboardDiv = document.getElementById('dashboard');
    const leaderboardDiv = document.getElementById('leaderboardContainer');
    const taskListDiv = document.getElementById('taskList');
    const dateStripDiv = document.getElementById('dateStrip');
    const datePicker = document.getElementById('datePicker');
    const authMsgDiv = document.getElementById('authMsg');

    function showAuthMessage(msg, isErr=true) {
        authMsgDiv.innerHTML = `<div style="background:${isErr?'#7f1a1a':'#14532d'};padding:0.5rem;border-radius:12px;">${msg}</div>`;
        setTimeout(()=>authMsgDiv.innerHTML='', 4000);
    }
    function escapeHtml(s) { return String(s).replace(/[&<>]/g, m=>m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }

    // Load all task dates for chip highlighting
    async function loadTaskDates() {
        const { data:tasks } = await sb.from('tasks').select('task_date');
        taskDatesSet.clear();
        (tasks||[]).forEach(t => taskDatesSet.add(t.task_date));
    }

    // Build date chips
    function buildDateStrip(selected) {
        if (!dateStripDiv) return;
        const today = new Date();
        let chips = [];
        for (let i=-7; i<=7; i++) {
            const d = new Date(today); d.setDate(today.getDate()+i);
            const ds = d.toISOString().slice(0,10);
            chips.push({
                ds,
                label: `${d.getDate()} ${d.toLocaleString('default',{month:'short'})}`,
                hasTask: taskDatesSet.has(ds),
                active: ds === selected
            });
        }
        dateStripDiv.innerHTML = chips.map(c => `<div class="date-chip ${c.active?'active':''} ${c.hasTask?'has-task':''}" data-date="${c.ds}">${c.label}</div>`).join('');
        document.querySelectorAll('.date-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                const newDate = chip.dataset.date;
                datePicker.value = newDate;
                loadTasksForDate(newDate);
                document.querySelectorAll('.date-chip').forEach(c=>c.classList.remove('active'));
                chip.classList.add('active');
            });
        });
    }

    // Leaderboard (average score)
    async function renderLeaderboard() {
        const { data: comps } = await sb.from('task_completions').select('user_id, user_name, score');
        if (!comps || comps.length===0) { leaderboardDiv.innerHTML='<div class="alert">📭 No scores yet.</div>'; return; }
        const map = new Map();
        for (const c of comps) {
            if (c.score===null) continue;
            if (!map.has(c.user_id)) map.set(c.user_id, { name: c.user_name || 'Student', scores: [] });
            map.get(c.user_id).scores.push(c.score);
        }
        let leaderboard = Array.from(map.entries()).map(([id, d]) => ({
            id, name: d.name,
            avg: Math.round(d.scores.reduce((a,b)=>a+b,0)/d.scores.length)
        })).sort((a,b)=>b.avg - a.avg);
        if (leaderboard.length===0) { leaderboardDiv.innerHTML='<div class="alert">📭 No valid scores.</div>'; return; }

        const top3 = leaderboard.slice(0,3);
        let podiumHtml = '<div class="leaderboard-grid">';
        // 2nd, 1st, 3rd order
        const order = [1,0,2];
        const classes = ['second','first','third'];
        for (let i=0; i<3; i++) {
            const u = top3[order[i]];
            if (!u) { podiumHtml += '<div></div>'; continue; }
            podiumHtml += `<div class="podium-card ${classes[i]}">
                <div class="podium-avatar" ${i===0?'style="width:70px;height:70px;"':''}>${u.name.charAt(0)}</div>
                <div>${escapeHtml(u.name)}</div>
                <div style="font-size:1.5rem;font-weight:bold;color:#facc15;">${u.avg}%</div>
            </div>`;
        }
        podiumHtml += `</div><div class="lb-list">`;
        leaderboard.forEach((u, idx) => {
            podiumHtml += `<div class="lb-row"><div>${idx+1}</div><div class="lb-name"><div class="lb-avatar">${u.name.charAt(0)}</div><span>${escapeHtml(u.name)}${u.id===currentUser?.id?' <span style="font-size:0.7rem;color:#facc15;">(You)</span>':''}</span></div><div class="lb-score">${u.avg}%</div></div>`;
        });
        podiumHtml += `</div>`;
        leaderboardDiv.innerHTML = podiumHtml;
    }

    // Load tasks for a specific date
    async function loadTasksForDate(date) {
        if (!date) return;
        taskListDiv.innerHTML = '<div class="alert">Loading...</div>';
        const { data: tasks, error } = await sb.from('tasks').select('*').eq('task_date', date);
        if (error) { taskListDiv.innerHTML = `<div class="alert">❌ ${error.message}</div>`; return; }
        if (!tasks.length) { taskListDiv.innerHTML = '<div class="alert">📭 No tasks for this date.</div>'; return; }

        const { data: comps } = await sb.from('task_completions').select('task_id, score').eq('user_id', currentUser.id);
        const completed = new Map((comps||[]).map(c=>[c.task_id, c.score]));

        let html = '';
        for (const t of tasks) {
            const done = completed.has(t.id);
            const score = completed.get(t.id);
            html += `
                <div class="task-card">
                    <div class="task-skill">${t.skill || 'Task'}</div>
                    <div class="task-title">${escapeHtml(t.title)}</div>
                    ${t.description ? `<div style="font-size:0.85rem; color:#cbd5e1; margin:0.3rem 0;">${escapeHtml(t.description.substring(0,150))}${t.description.length>150?'…':''}</div>` : ''}
                    ${done ? `<span class="completed-badge">✅ Completed (${score}%)</span>` : `<button class="complete-btn" data-id="${t.id}">✓ Mark as Completed</button>`}
                </div>
            `;
        }
        taskListDiv.innerHTML = html;

        // Handle complete buttons
        document.querySelectorAll('.complete-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const taskId = btn.dataset.id;
                const score = prompt("Enter your score (0-100):", "75");
                if (score === null) return;
                const num = parseInt(score);
                if (isNaN(num) || num<0 || num>100) { alert("Score must be 0-100"); return; }
                const { error } = await sb.from('task_completions').insert({
                    task_id: taskId,
                    user_id: currentUser.id,
                    score: num,
                    user_name: currentUser.user_metadata?.full_name || currentUser.email.split('@')[0],
                    completed_at: new Date().toISOString()
                });
                if (error) alert("Error: " + error.message);
                else {
                    alert(`✅ Score ${num}% saved!`);
                    await loadTasksForDate(date);
                    await renderLeaderboard();
                }
            });
        });
    }

    // ========== AUTH ==========
    async function login() {
        const email = document.getElementById('email').value.trim();
        const pwd = document.getElementById('password').value;
        if (!email || !pwd) { showAuthMessage('Enter email and password'); return; }
        const btn = document.getElementById('loginBtn');
        btn.disabled = true; btn.textContent = 'Signing in...';
        const { error } = await sb.auth.signInWithPassword({ email, password: pwd });
        btn.disabled = false; btn.textContent = 'Sign In';
        if (error) showAuthMessage(error.message);
    }
    async function logout() { await sb.auth.signOut(); }
    async function signup() {
        const email = prompt("Enter email:");
        if (!email) return;
        const pwd = prompt("Password (min 6 chars):");
        if (!pwd || pwd.length<6) { alert("Password too short"); return; }
        const name = prompt("Full name (optional):", email.split('@')[0]);
        const { error } = await sb.auth.signUp({
            email, password: pwd,
            options: { data: { full_name: name || email.split('@')[0] } }
        });
        if (error) alert(error.message);
        else alert("Account created! Check email to confirm.");
    }
    async function resetPassword() {
        const email = prompt("Enter your email for reset link:");
        if (!email) return;
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });
        if (error) alert(error.message);
        else alert("Reset link sent!");
    }
    async function updateUI(user) {
        if (user) {
            currentUser = user;
            authCard.style.display = 'none';
            dashboardDiv.style.display = 'block';
            await loadTaskDates();
            const today = new Date().toISOString().slice(0,10);
            datePicker.value = today;
            await loadTasksForDate(today);
            await renderLeaderboard();
            buildDateStrip(today);
        } else {
            currentUser = null;
            authCard.style.display = 'block';
            dashboardDiv.style.display = 'none';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        }
    }

    sb.auth.onAuthStateChange((event, session) => updateUI(session?.user || null));
    (async () => {
        const { data: { user } } = await sb.auth.getUser();
        await updateUI(user);
    })();

    document.getElementById('loginBtn').addEventListener('click', login);
    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('loadTasksBtn').addEventListener('click', () => {
        const date = datePicker.value;
        if (date) {
            loadTasksForDate(date);
            buildDateStrip(date);
        }
    });
    datePicker.addEventListener('change', (e) => {
        const date = e.target.value;
        if (date) {
            loadTasksForDate(date);
            buildDateStrip(date);
        }
    });
    document.getElementById('showSignupBtn')?.addEventListener('click', signup);
    document.getElementById('showResetBtn')?.addEventListener('click', resetPassword);
</script>
</body>
</html>
