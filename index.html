<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>IELTS Student · Daily Tasks</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            padding: 1.5rem;
            min-height: 100vh;
        }

        /* main container */
        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* cards */
        .card {
            background: #1e293b;
            border-radius: 28px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, #facc15, #fbbf24);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.25rem;
        }

        h2 {
            font-size: 1.3rem;
            font-weight: 500;
            margin-bottom: 1rem;
            color: #facc15;
        }

        /* inputs & buttons */
        input, button {
            font-family: inherit;
            border-radius: 16px;
            border: none;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        input {
            background: #334155;
            color: #f1f5f9;
            border: 1px solid #475569;
            width: 100%;
            margin-bottom: 0.8rem;
        }

        input:focus {
            outline: none;
            border-color: #facc15;
            box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.2);
        }

        button {
            background: #facc15;
            color: #0f172a;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        button:hover {
            background: #eab308;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #475569;
            color: #f1f5f9;
        }
        .btn-secondary:hover {
            background: #334155;
        }

        /* task cards */
        .task-card {
            background: #334155;
            border-radius: 20px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            transition: all 0.2s;
            border: 1px solid #475569;
        }

        .task-card:hover {
            background: #3b4252;
            transform: translateX(4px);
        }

        .task-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #facc15;
            margin-bottom: 0.3rem;
        }

        .task-skill {
            display: inline-block;
            background: #1e293b;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
            margin-bottom: 0.6rem;
        }

        .task-desc {
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .completed-badge {
            background: #10b981;
            color: white;
            display: inline-block;
            padding: 0.3rem 0.9rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        button.complete-btn {
            background: #10b981;
            color: white;
            margin-top: 0.5rem;
            width: auto;
            padding: 0.5rem 1.2rem;
        }

        button.complete-btn:hover {
            background: #059669;
        }

        .date-picker-wrapper {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .date-picker-wrapper input {
            flex: 2;
            margin-bottom: 0;
            background: #334155;
        }

        .alert {
            padding: 0.8rem 1rem;
            border-radius: 16px;
            background: #2d3748;
            color: #facc15;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }

        .auth-links {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.85rem;
        }
        .auth-links a {
            color: #facc15;
            text-decoration: none;
            cursor: pointer;
        }
        .auth-links a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #64748b;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }
            .card {
                padding: 1.2rem;
            }
            .date-picker-wrapper button {
                flex: 1;
            }
            .task-title {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- AUTH CARD (login) -->
    <div id="authCard" class="card">
        <h1>📚 IELTS Daily</h1>
        <p style="margin-bottom: 1.2rem; color: #94a3b8;">Student · Daily Tasks</p>
        <input type="email" id="email" placeholder="Email address" autocomplete="email">
        <input type="password" id="password" placeholder="Password" autocomplete="current-password">
        <button id="loginBtn" style="width: 100%;">Sign In</button>
        <div class="auth-links">
            <a id="showSignupBtn">Create account</a> &nbsp;|&nbsp;
            <a id="showResetBtn">Forgot password?</a>
        </div>
        <div id="authMsg" style="margin-top: 1rem; font-size: 0.8rem;"></div>
    </div>

    <!-- DASHBOARD (visible after login) -->
    <div id="dashboard" style="display: none;">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem;">
                <h1>📖 Today's Tasks</h1>
                <button id="logoutBtn" class="btn-secondary" style="padding: 0.4rem 1rem;">Sign Out</button>
            </div>
            <div class="date-picker-wrapper">
                <input type="date" id="datePicker">
                <button id="loadTasksBtn">Load Tasks</button>
            </div>
            <div id="taskList">
                <div class="alert">⬅️ Select a date and click “Load Tasks”</div>
            </div>
        </div>
    </div>

    <!-- hidden signup / reset modals will use simple prompts (keeping minimal) -->
    <footer>© IELTS Daily — keep practicing</footer>
</div>

<script>
    const SUPABASE_URL = 'https://wqoshwbtxulnlfccbuvi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indxb3Nod2J0eHVsbmxmY2NidXZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0ODAwMTgsImV4cCI6MjA5MzA1NjAxOH0.ChxkoIlruVPtontdf0_uvG__XSpZdVhScxR1f-F_ArA';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null;

    // DOM elements
    const authCard = document.getElementById('authCard');
    const dashboard = document.getElementById('dashboard');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const loadTasksBtn = document.getElementById('loadTasksBtn');
    const datePicker = document.getElementById('datePicker');
    const taskListDiv = document.getElementById('taskList');
    const authMsgDiv = document.getElementById('authMsg');

    // Helper: show message in auth card
    function showAuthMessage(msg, isError = true) {
        authMsgDiv.innerHTML = `<div style="background: ${isError ? '#7f1a1a' : '#14532d'}; padding: 0.6rem; border-radius: 12px;">${msg}</div>`;
        setTimeout(() => { if (authMsgDiv) authMsgDiv.innerHTML = ''; }, 4000);
    }

    // LOGIN
    async function login() {
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        if (!email || !password) {
            showAuthMessage('Please enter email and password');
            return;
        }
        loginBtn.disabled = true;
        loginBtn.textContent = 'Signing in...';
        const { error } = await sb.auth.signInWithPassword({ email, password });
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
        if (error) {
            showAuthMessage(error.message);
        } else {
            // session will trigger onAuthStateChange
        }
    }

    // LOGOUT
    async function logout() {
        await sb.auth.signOut();
        // UI will reset via onAuthStateChange
    }

    // SIGNUP (prompt-based, simple)
    async function signup() {
        const email = prompt("Enter your email address:");
        if (!email) return;
        const password = prompt("Create a password (min 6 characters):");
        if (!password || password.length < 6) {
            alert("Password must be at least 6 characters");
            return;
        }
        const name = prompt("Your full name (optional):", email.split('@')[0]);
        const { error } = await sb.auth.signUp({
            email,
            password,
            options: { data: { full_name: name || email.split('@')[0] } }
        });
        if (error) {
            alert("Signup error: " + error.message);
        } else {
            alert("Account created! Please check your email to confirm (or disable email confirmation in Supabase).");
        }
    }

    // PASSWORD RESET
    async function resetPassword() {
        const email = prompt("Enter your email address to receive a reset link:");
        if (!email) return;
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });
        if (error) {
            alert("Error: " + error.message);
        } else {
            alert("Password reset link sent! Check your email.");
        }
    }

    // LOAD TASKS for selected date
    async function loadTasks() {
        const date = datePicker.value;
        if (!date) {
            taskListDiv.innerHTML = '<div class="alert">📅 Please select a date first.</div>';
            return;
        }
        taskListDiv.innerHTML = '<div class="alert">⏳ Loading tasks...</div>';
        const { data: tasks, error } = await sb.from('tasks').select('*').eq('task_date', date);
        if (error) {
            taskListDiv.innerHTML = `<div class="alert">❌ Error: ${error.message}</div>`;
            return;
        }
        if (!tasks || tasks.length === 0) {
            taskListDiv.innerHTML = '<div class="alert">📭 No tasks for this date. Check back later!</div>';
            return;
        }

        // Get completions for current user
        const { data: completions } = await sb.from('task_completions').select('task_id, score').eq('user_id', currentUser.id);
        const completedMap = new Map();
        (completions || []).forEach(c => completedMap.set(c.task_id, c.score));

        let html = '';
        for (const task of tasks) {
            const completed = completedMap.has(task.id);
            const score = completedMap.get(task.id);
            html += `
                <div class="task-card">
                    <div class="task-skill">${task.skill || 'General'}</div>
                    <div class="task-title">${escapeHtml(task.title)}</div>
                    ${task.description ? `<div class="task-desc">${escapeHtml(task.description.substring(0, 200))}${task.description.length > 200 ? '…' : ''}</div>` : ''}
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
                        ${completed ? `<span class="completed-badge">✅ Completed (${score}%)</span>` : `<button class="complete-btn" data-task-id="${task.id}">✓ Mark as Completed</button>`}
                    </div>
                </div>
            `;
        }
        taskListDiv.innerHTML = html;

        // attach event listeners to complete buttons (only for incomplete tasks)
        document.querySelectorAll('.complete-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const taskId = btn.dataset.taskId;
                const score = prompt("Enter your score (0-100):", "75");
                if (score === null) return;
                const numScore = parseInt(score);
                if (isNaN(numScore) || numScore < 0 || numScore > 100) {
                    alert("Score must be between 0 and 100");
                    return;
                }
                const { error } = await sb.from('task_completions').insert({
                    task_id: taskId,
                    user_id: currentUser.id,
                    score: numScore,
                    completed_at: new Date().toISOString()
                });
                if (error) {
                    alert("Error: " + error.message);
                } else {
                    alert(`✅ Score ${numScore}% saved!`);
                    loadTasks(); // refresh
                }
            });
        });
    }

    // Helper to escape HTML
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // UI update based on session
    async function updateUIForUser(user) {
        if (user) {
            currentUser = user;
            authCard.style.display = 'none';
            dashboard.style.display = 'block';
            // set default date to today
            const today = new Date().toISOString().slice(0,10);
            datePicker.value = today;
            await loadTasks();
        } else {
            currentUser = null;
            authCard.style.display = 'block';
            dashboard.style.display = 'none';
            emailInput.value = '';
            passwordInput.value = '';
        }
    }

    // Auth state change listener
    sb.auth.onAuthStateChange((event, session) => {
        updateUIForUser(session?.user || null);
    });

    // Check existing session on page load
    (async () => {
        const { data: { user } } = await sb.auth.getUser();
        await updateUIForUser(user);
    })();

    // EVENT LISTENERS
    loginBtn.addEventListener('click', login);
    logoutBtn.addEventListener('click', logout);
    loadTasksBtn.addEventListener('click', loadTasks);
    document.getElementById('showSignupBtn')?.addEventListener('click', signup);
    document.getElementById('showResetBtn')?.addEventListener('click', resetPassword);
</script>
</body>
</html>
