<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Student · Simple Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui; background: #0f172a; color: #e2e8f0; padding: 2rem; max-width: 800px; margin: 0 auto; }
        .card { background: #1e293b; border-radius: 24px; padding: 2rem; margin-bottom: 1.5rem; }
        input, button { padding: 0.5rem; margin: 0.5rem 0; border-radius: 8px; border: none; }
        button { background: #facc15; color: #0f172a; font-weight: bold; cursor: pointer; }
        .error { color: #f87171; }
        .success { color: #4ade80; }
        .task { background: #334155; padding: 1rem; margin-bottom: 1rem; border-radius: 12px; }
    </style>
</head>
<body>

<div id="auth">
    <div class="card">
        <h2>Student Login</h2>
        <input type="email" id="email" placeholder="Email"><br>
        <input type="password" id="password" placeholder="Password"><br>
        <button onclick="login()">Sign In</button>
        <p><a href="#" onclick="showSignup()">Create account</a></p>
        <div id="authMsg"></div>
    </div>
</div>

<div id="dashboard" style="display:none">
    <div class="card">
        <h2>📅 Daily Tasks</h2>
        <input type="date" id="datePicker" value="">
        <button onclick="loadTasks()">Load Tasks</button>
        <div id="taskList"></div>
        <button onclick="logout()" style="margin-top:1rem; background:#475569;">Sign Out</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://wqoshwbtxulnlfccbuvi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indxb3Nod2J0eHVsbmxmY2NidXZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0ODAwMTgsImV4cCI6MjA5MzA1NjAxOH0.ChxkoIlruVPtontdf0_uvG__XSpZdVhScxR1f-F_ArA';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null;

    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) { document.getElementById('authMsg').innerText = error.message; return; }
        checkSession();
    }

    async function logout() { await sb.auth.signOut(); location.reload(); }

    function showSignup() {
        // Simple signup prompt (you can expand)
        const email = prompt("Enter email for new account:");
        const password = prompt("Enter password:");
        if (email && password) {
            sb.auth.signUp({ email, password }).then(({ error }) => {
                alert(error ? error.message : "Account created! Check email to confirm (or disable email confirmation in Supabase).");
            });
        }
    }

    async function checkSession() {
        const { data: { user } } = await sb.auth.getUser();
        if (user) {
            currentUser = user;
            document.getElementById('auth').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('datePicker').value = new Date().toISOString().slice(0,10);
            loadTasks();
        } else {
            document.getElementById('auth').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
        }
    }

    async function loadTasks() {
        const date = document.getElementById('datePicker').value;
        if (!date) return;
        const { data: tasks, error } = await sb.from('tasks').select('*').eq('task_date', date);
        if (error) { document.getElementById('taskList').innerHTML = `<div class="error">Error: ${error.message}</div>`; return; }
        if (!tasks.length) { document.getElementById('taskList').innerHTML = '<div>No tasks for this date.</div>'; return; }

        // Get already completed task IDs for this user
        const { data: completions } = await sb.from('task_completions').select('task_id').eq('user_id', currentUser.id);
        const completedIds = new Set(completions?.map(c => c.task_id) || []);

        let html = '';
        for (let task of tasks) {
            const completed = completedIds.has(task.id);
            html += `
                <div class="task">
                    <strong>${task.title}</strong><br>
                    <small>${task.skill || 'Task'}</small>
                    <p>${task.description || ''}</p>
                    ${completed ? '<span class="success">✅ Completed</span>' : `<button onclick="completeTask('${task.id}')">Mark as Completed</button>`}
                </div>
            `;
        }
        document.getElementById('taskList').innerHTML = html;
    }

    async function completeTask(taskId) {
        const score = prompt("Enter your score (0-100):", "75");
        if (score === null) return;
        const numScore = parseInt(score);
        if (isNaN(numScore) || numScore < 0 || numScore > 100) { alert("Score must be 0-100"); return; }
        const { error } = await sb.from('task_completions').insert({
            task_id: taskId,
            user_id: currentUser.id,
            score: numScore,
            completed_at: new Date().toISOString()
        });
        if (error) alert("Error: " + error.message);
        else {
            alert("Task completed!");
            loadTasks();
        }
    }

    checkSession();
</script>
</body>
</html>
