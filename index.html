<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IELTS Daily Tasks | Mr Zufar</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0d0f14; --surface: #161920; --surface2: #1e2230; --border: #2a2f3d;
      --accent: #f0c040; --accent2: #e07b3f; --text: #eef0f6; --muted: #7a8099;
      --success: #4caf82; --danger: #e05c5c; --radius: 14px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    
    /* Layout */
    #auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    #app-screen { display: none; }
    
    .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 30px 60px rgba(0,0,0,0.5); }
    .topnav { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; border-bottom: 1px solid var(--border); background: rgba(13,15,20,0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
    
    /* Stats & Calendar */
    .main-content { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 30px; width: fit-content; min-width: 150px; }
    .date-strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 30px; scrollbar-width: none; }
    .date-chip { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; min-width: 65px; transition: 0.2s; }
    .date-chip.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #000; border-color: transparent; }
    
    /* Task Cards */
    .task-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; border-left: 4px solid var(--accent); transition: transform 0.2s; }
    .task-card:hover { transform: translateY(-3px); }
    .task-skill { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--accent); background: rgba(240,192,64,0.1); padding: 4px 10px; border-radius: 50px; display: inline-block; margin-bottom: 10px; }
    .task-title { font-family: 'Playfair Display', serif; font-size: 22px; margin-bottom: 12px; }
    
    /* UI Components */
    .btn { padding: 12px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; width: 100%; transition: 0.2s; }
    .btn-primary { background: var(--accent); color: #000; }
    .input-field { width: 100%; background: var(--surface2); border: 1px solid var(--border); padding: 12px; border-radius: 10px; color: #fff; margin-bottom: 15px; outline: none; }
  </style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-card">
    <h2 style="font-family:'Playfair Display'; margin-bottom:20px;">IELTS Student Login</h2>
    <input type="email" id="email" class="input-field" placeholder="Email">
    <input type="password" id="pass" class="input-field" placeholder="Password">
    <button class="btn btn-primary" onclick="handleLogin()">Sign In</button>
    <p id="auth-err" style="color:var(--danger); font-size:13px; margin-top:10px; display:none;"></p>
  </div>
</div>

<div id="app-screen">
  <nav class="topnav">
    <div style="font-family:'Playfair Display'; font-size:20px;">📚 IELTS Daily</div>
    <button onclick="sb.auth.signOut()" style="background:none; border:1px solid var(--border); color:var(--muted); padding:5px 12px; border-radius:8px; cursor:pointer;">Sign Out</button>
  </nav>

  <div class="main-content">
    <h1 style="font-family:'Playfair Display'; font-size:32px; margin-bottom:5px;">Daily Study <span>Plan</span></h1>
    <p id="current-user-msg" style="color:var(--muted); margin-bottom:25px;"></p>

    <div class="stat-card">
      <div style="font-size:11px; color:var(--muted); text-transform:uppercase;">Total Tasks Ready</div>
      <div style="font-size:32px; font-family:'Playfair Display';" id="stat-total">0</div>
    </div>

    <div class="date-strip" id="date-strip"></div>
    <div id="task-area"></div>
  </div>
</div>

<script>
  // Credentials exactly from your previous context
  const S_URL = 'https://wqoshwbtxulnlfccbuvi.supabase.co';
  const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indxb3Nod2J0eHVsbmxmY2NidXZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0ODAwMTgsImV4cCI6MjA5MzA1NjAxOH0.ChxkoIlruVPtontdf0_uvG__XSpZdVhScxR1f-F_ArA';
  const sb = supabase.createClient(S_URL, S_KEY);

  let allTasks = [];
  let selectedDate = new Date().toISOString().split('T')[0];

  // Auth Listener
  sb.auth.onAuthStateChange((event, session) => {
    if (session) {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'block';
      document.getElementById('current-user-msg').textContent = `Welcome, ${session.user.email}`;
      loadTasks();
    } else {
      document.getElementById('auth-screen').style.display = 'flex';
      document.getElementById('app-screen').style.display = 'none';
    }
  });

  async function handleLogin() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('pass').value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      const errEl = document.getElementById('auth-err');
      errEl.textContent = error.message;
      errEl.style.display = 'block';
    }
  }

  async function loadTasks() {
    // Fetching from 'tasks' table as seen in your screenshot
    const { data, error } = await sb.from('tasks').select('*').order('task_date', { ascending: true });
    if (!error) {
      allTasks = data;
      document.getElementById('stat-total').textContent = allTasks.length;
      renderDateStrip();
      renderTasks(selectedDate);
    }
  }

  function renderDateStrip() {
    const strip = document.getElementById('date-strip');
    strip.innerHTML = '';
    const now = new Date();
    for (let i = -3; i <= 3; i++) {
      const d = new Date(now);
      d.setDate(now.getDate() + i);
      const ds = d.toISOString().split('T')[0];
      const chip = document.createElement('div');
      chip.className = `date-chip ${ds === selectedDate ? 'active' : ''}`;
      chip.innerHTML = `<span style="font-size:18px; font-weight:700;">${d.getDate()}</span><span style="font-size:11px;">${d.toLocaleString('default', {month:'short'})}</span>`;
      chip.onclick = () => { selectedDate = ds; renderDateStrip(); renderTasks(ds); };
      strip.appendChild(chip);
    }
  }

  function renderTasks(dateStr) {
    const area = document.getElementById('task-area');
    // Using 'task_date' column name from image_287720.png
    const filtered = allTasks.filter(t => t.task_date === dateStr);

    if (filtered.length === 0) {
      area.innerHTML = `<p style="color:var(--muted); text-align:center; padding:20px;">No tasks scheduled for this day.</p>`;
      return;
    }

    // Using 'task_type' and 'title' from image_287720.png
    area.innerHTML = filtered.map(t => `
      <div class="task-card">
        <span class="task-skill">${t.task_type || 'General'}</span>
        <h3 class="task-title">${t.title}</h3>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:13px; color:var(--muted);">🕒 Due: ${t.due_time || '23:59'}</span>
          <button class="btn" style="width:auto; padding:8px 15px; font-size:12px; background:var(--surface2); color:var(--accent); border:1px solid var(--border);">Open Task</button>
        </div>
      </div>
    `).join('');
  }
</script>
</body>
</html>
