<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS Daily | Student Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,500;0,600;0,700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
    }

    /* dark accent for contrast */
    :root {
      --primary: #0f172a;
      --primary-light: #1e293b;
      --accent: #facc15;
      --accent-dark: #eab308;
      --border: #e2e8f0;
      --surface: #ffffff;
      --surface2: #f1f5f9;
      --muted: #64748b;
      --success: #10b981;
    }

    /* Auth container */
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      padding: 24px;
    }
    .auth-card {
      background: var(--surface);
      border-radius: 32px;
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15);
      border: 1px solid var(--border);
    }
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .auth-logo-icon {
      width: 44px;
      height: 44px;
      background: var(--primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .auth-logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 600;
    }
    .auth-title {
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .auth-heading {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      transition: all 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(250,204,21,0.2);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
      width: 100%;
    }
    .btn-primary:hover {
      background: var(--primary-light);
      transform: translateY(-1px);
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
    }
    .auth-toggle {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }
    .auth-toggle a {
      color: var(--primary);
      cursor: pointer;
      text-decoration: none;
      font-weight: 500;
    }
    .error-message, .success-message {
      font-size: 12px;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    .error-message { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
    .success-message { background: #dcfce7; color: #16a34a; border: 1px solid #bbf7d0; }

    /* Dashboard */
    .dashboard { display: none; }
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
    }
    .logo span { color: var(--accent-dark); }
    .user-area {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      color: white;
      font-weight: 600;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .btn-small {
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 6px 12px;
      font-size: 12px;
    }
    .main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
    }
    .stat-label {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .stat-value {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 700;
    }
    /* Date strip */
    .date-strip {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 28px;
    }
    .date-chip {
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 8px 20px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      font-weight: 500;
    }
    .date-chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .date-chip.has-task { border-color: var(--accent); }
    /* Task card */
    .task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 20px;
      transition: all 0.2s;
    }
    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .task-skill {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 40px;
      background: var(--surface2);
      color: var(--muted);
    }
    .task-title {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      margin-bottom: 10px;
    }
    .task-desc {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .task-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .completed-badge {
      background: #dcfce7;
      color: #15803d;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 600;
    }
    /* Leaderboard */
    .leaderboard-section {
      margin-top: 48px;
    }
    .lb-podium {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 16px;
      align-items: end;
      margin-bottom: 32px;
    }
    .podium-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 20px;
      text-align: center;
    }
    .podium-card.first { background: linear-gradient(160deg, rgba(250,204,21,0.1), white); border-color: var(--accent); padding-top: 28px; }
    .podium-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      margin: 0 auto 12px;
      background: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-weight: bold;
    }
    .first .podium-avatar { width: 80px; height: 80px; }
    .lb-list {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
    }
    .lb-header {
      display: grid;
      grid-template-columns: 60px 1fr 100px;
      padding: 14px 20px;
      background: var(--surface2);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .lb-row {
      display: grid;
      grid-template-columns: 60px 1fr 100px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      align-items: center;
    }
    .lb-name { display: flex; align-items: center; gap: 12px; }
    .lb-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--surface2); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal {
      background: var(--surface);
      border-radius: 28px;
      max-width: 800px;
      width: 90%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 32px;
    }
    .task-iframe { width: 100%; height: 500px; border: none; border-radius: 16px; background: white; margin: 16px 0; }
    button { cursor: pointer; }
  </style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="authContainer" class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">📚</div>
      <div class="auth-logo-text">IELTS Daily</div>
    </div>
    <div class="auth-title">Welcome</div>
    <h1 class="auth-heading" id="authHeading">Sign in to your account</h1>
    <div id="authMessage"></div>
    <div id="loginForm">
      <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="your@email.com"></div>
      <div class="form-group"><label>Password</label><input type="password" id="loginPassword" placeholder="••••••••"></div>
      <button class="btn btn-primary" id="loginBtn">Sign In</button>
      <div class="auth-toggle">No account? <a id="showSignup">Create one</a> &nbsp;·&nbsp; <a id="showReset">Forgot password?</a></div>
    </div>
    <div id="signupForm" style="display:none">
      <div class="form-group"><label>Full Name</label><input type="text" id="signupName" placeholder="Your name"></div>
      <div class="form-group"><label>Email</label><input type="email" id="signupEmail" placeholder="your@email.com"></div>
      <div class="form-group"><label>Password</label><input type="password" id="signupPassword" placeholder="Min. 6 characters"></div>
      <button class="btn btn-primary" id="signupBtn">Create Account</button>
      <div class="auth-toggle">Already have an account? <a id="showLogin">Sign in</a></div>
    </div>
    <div id="resetForm" style="display:none">
      <div class="form-group"><label>Email</label><input type="email" id="resetEmail" placeholder="your@email.com"></div>
      <button class="btn btn-primary" id="resetBtn">Send reset link</button>
      <div class="auth-toggle"><a id="backToLogin">← Back to sign in</a></div>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="dashboard">
  <div class="topbar">
    <div class="logo">IELTS <span>Daily</span></div>
    <div class="user-area">
      <div class="avatar" id="avatarBtn" onclick="openAvatarUpload()">
        <span id="avatarInitials">?</span>
      </div>
      <span id="userName"></span>
      <button class="btn btn-small" id="logoutBtn">Sign out</button>
    </div>
  </div>
  <div class="main">
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="stat-label">This Week</div><div class="stat-value" id="statWeek">—</div></div>
      <div class="stat-card"><div class="stat-label">Total Tasks</div><div class="stat-value" id="statTotal">—</div></div>
      <div class="stat-card"><div class="stat-label">Completed</div><div class="stat-value" id="statCompleted">—</div></div>
      <div class="stat-card"><div class="stat-label">Avg Score</div><div class="stat-value" id="statAvgScore">—</div></div>
    </div>

    <div class="date-strip" id="dateStrip"></div>
    <div id="tasksContainer"></div>

    <div class="leaderboard-section">
      <h2 style="font-family:'Playfair Display'; margin-bottom:20px;">🏆 Leaderboard (Average Score)</h2>
      <div id="leaderboard"></div>
    </div>
  </div>
</div>

<!-- Avatar upload input (hidden) -->
<input type="file" id="avatarFile" accept="image/*" style="display:none" onchange="uploadAvatar(this)">

<script>
  // ============ SUPABASE CONFIG ============
  const SUPABASE_URL = 'https://wqoshwbtxulnlfccbuvi.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indxb3Nod2J0eHVsbmxmY2NidXZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0ODAwMTgsImV4cCI6MjA5MzA1NjAxOH0.ChxkoIlruVPtontdf0_uvG__XSpZdVhScxR1f-F_ArA';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let allTasks = [];
  let taskDates = new Set();
  let selectedDate = new Date().toISOString().slice(0,10);
  let avatarUrl = null;

  // Helper
  function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ============ AUTH UI ============
  const authContainer = document.getElementById('authContainer');
  const dashboard = document.getElementById('dashboard');
  const authHeading = document.getElementById('authHeading');
  const loginForm = document.getElementById('loginForm');
  const signupForm = document.getElementById('signupForm');
  const resetForm = document.getElementById('resetForm');
  const authMsg = document.getElementById('authMessage');

  function showAuthError(msg) { authMsg.innerHTML = `<div class="error-message">${msg}</div>`; }
  function showAuthSuccess(msg) { authMsg.innerHTML = `<div class="success-message">${msg}</div>`; }
  function clearAuthMsg() { authMsg.innerHTML = ''; }

  document.getElementById('showSignup').onclick = () => { clearAuthMsg(); loginForm.style.display='none'; signupForm.style.display='block'; resetForm.style.display='none'; authHeading.innerText='Create your account'; };
  document.getElementById('showLogin').onclick = () => { clearAuthMsg(); loginForm.style.display='block'; signupForm.style.display='none'; resetForm.style.display='none'; authHeading.innerText='Sign in to your account'; };
  document.getElementById('showReset').onclick = () => { clearAuthMsg(); loginForm.style.display='none'; signupForm.style.display='none'; resetForm.style.display='block'; authHeading.innerText='Reset password'; };
  document.getElementById('backToLogin').onclick = () => { clearAuthMsg(); loginForm.style.display='block'; signupForm.style.display='none'; resetForm.style.display='none'; authHeading.innerText='Sign in to your account'; };

  document.getElementById('loginBtn').onclick = async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) { showAuthError('Please fill all fields'); return; }
    const btn = document.getElementById('loginBtn'); btn.disabled = true; btn.innerText = 'Signing in...';
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    btn.disabled = false; btn.innerText = 'Sign In';
    if (error) showAuthError(error.message);
  };
  document.getElementById('signupBtn').onclick = async () => {
    const name = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    if (!name || !email || !password) { showAuthError('Please fill all fields'); return; }
    if (password.length < 6) { showAuthError('Password must be at least 6 characters'); return; }
    const btn = document.getElementById('signupBtn'); btn.disabled = true; btn.innerText = 'Creating...';
    const { error } = await supabase.auth.signUp({ email, password, options: { data: { full_name: name } } });
    btn.disabled = false; btn.innerText = 'Create Account';
    if (error) showAuthError(error.message);
    else showAuthSuccess('Account created! Check your email to confirm, then sign in.');
  };
  document.getElementById('resetBtn').onclick = async () => {
    const email = document.getElementById('resetEmail').value.trim();
    if (!email) { showAuthError('Enter your email'); return; }
    const btn = document.getElementById('resetBtn'); btn.disabled = true; btn.innerText = 'Sending...';
    const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });
    btn.disabled = false; btn.innerText = 'Send reset link';
    if (error) showAuthError(error.message);
    else showAuthSuccess('Reset link sent. Check your email.');
  };
  document.getElementById('logoutBtn').onclick = async () => { await supabase.auth.signOut(); };

  // ============ DASHBOARD INIT ============
  async function loadUserProfile() {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) return;
    currentUser = user;
    const name = user.user_metadata?.full_name || user.email.split('@')[0];
    document.getElementById('userName').innerText = name;
    const letter = name.charAt(0).toUpperCase();
    document.getElementById('avatarInitials').innerText = letter;
    avatarUrl = user.user_metadata?.avatar_url || null;
    if (avatarUrl) {
      document.getElementById('avatarBtn').innerHTML = `<img src="${avatarUrl}" style="width:100%;height:100%;object-fit:cover">`;
    } else {
      document.getElementById('avatarBtn').innerHTML = `<span id="avatarInitials">${letter}</span>`;
    }
    await loadTasksAndDates();
  }

  async function loadTasksAndDates() {
    const { data, error } = await supabase.from('tasks').select('*').order('task_date', { ascending: false });
    if (error) { console.error(error); return; }
    allTasks = data || [];
    taskDates = new Set(allTasks.map(t => t.task_date));
    updateStats();
    buildDateStrip();
    renderTasksForDate(selectedDate);
    renderLeaderboard();
  }

  function updateStats() {
    const today = new Date().toISOString().slice(0,10);
    const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate()-7);
    const weekStr = weekAgo.toISOString().slice(0,10);
    const thisWeek = allTasks.filter(t => t.task_date >= weekStr).length;
    document.getElementById('statWeek').innerText = thisWeek;
    document.getElementById('statTotal').innerText = allTasks.length;

    // user completions
    (async () => {
      const { data: comps } = await supabase.from('task_completions').select('score').eq('user_id', currentUser.id);
      const completedCount = comps?.length || 0;
      document.getElementById('statCompleted').innerText = completedCount;
      const scores = comps?.filter(c => c.score !== null).map(c => c.score) || [];
      const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : 0;
      document.getElementById('statAvgScore').innerText = avg || '—';
    })();
  }

  function buildDateStrip() {
    const strip = document.getElementById('dateStrip');
    strip.innerHTML = '';
    const now = new Date();
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    for (let i = -7; i <= 14; i++) {
      const d = new Date(now); d.setDate(now.getDate()+i);
      const ds = d.toISOString().slice(0,10);
      const chip = document.createElement('div');
      chip.className = 'date-chip';
      if (ds === selectedDate) chip.classList.add('active');
      if (taskDates.has(ds)) chip.classList.add('has-task');
      chip.innerHTML = `${d.getDate()} ${months[d.getMonth()]}`;
      chip.onclick = () => {
        selectedDate = ds;
        document.querySelectorAll('.date-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        renderTasksForDate(ds);
      };
      strip.appendChild(chip);
    }
  }

  async function renderTasksForDate(date) {
    const tasks = allTasks.filter(t => t.task_date === date);
    const container = document.getElementById('tasksContainer');
    if (tasks.length === 0) {
      container.innerHTML = `<div style="text-align:center;padding:60px;background:white;border-radius:24px;border:1px solid var(--border)">📅 No tasks for this day.</div>`;
      return;
    }
    // get current user's completions for these tasks
    const taskIds = tasks.map(t => t.id);
    const { data: completions } = await supabase.from('task_completions').select('task_id, score').eq('user_id', currentUser.id).in('task_id', taskIds);
    const completedMap = new Map();
    (completions || []).forEach(c => completedMap.set(c.task_id, c.score));
    container.innerHTML = tasks.map(task => {
      const score = completedMap.get(task.id);
      const done = score !== undefined;
      const external = task.external_html_url && task.external_html_url.trim().length > 0;
      return `
        <div class="task-card">
          <div class="task-header">
            <span class="task-skill">${task.skill || 'Task'}</span>
            ${done ? `<span class="completed-badge">✓ Completed (${score}%)</span>` : ''}
          </div>
          <div class="task-title">${escHtml(task.title)}</div>
          ${task.description ? `<div class="task-desc">${escHtml(task.description).substring(0,150)}...</div>` : ''}
          <div class="task-actions">
            <button class="btn btn-outline" onclick="openTask('${task.id}', ${!!external})">${done ? 'View / Review' : 'Start Task'}</button>
          </div>
        </div>
      `;
    }).join('');
  }

  async function openTask(taskId, isExternal) {
    const task = allTasks.find(t => t.id === taskId);
    if (!task) return;
    // check if already completed
    const { data: existing } = await supabase.from('task_completions').select('score').eq('task_id', taskId).eq('user_id', currentUser.id).maybeSingle();
    if (existing && existing.score !== null) {
      alert(`You already completed this task with score ${existing.score}%. You can review it.`);
      return;
    }
    if (isExternal && task.external_html_url) {
      // embed iframe and listen for score
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="modal">
          <div style="display:flex;justify-content:space-between;margin-bottom:16px"><h3>${escHtml(task.title)}</h3><button onclick="closeModal(this)">✕</button></div>
          <iframe src="${task.external_html_url}" class="task-iframe" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals"></iframe>
          <p style="font-size:12px;color:gray;margin-top:8px">Complete the task – your score will be automatically submitted.</p>
        </div>
      `;
      document.body.appendChild(modal);
      modal.style.display = 'flex';
      const handler = (event) => {
        if (event.data && event.data.type === 'taskScore') {
          const score = parseInt(event.data.score, 10);
          if (!isNaN(score) && score >= 0 && score <= 100) {
            submitScore(taskId, score);
            modal.remove();
            window.removeEventListener('message', handler);
          }
        }
      };
      window.addEventListener('message', handler);
      modal.querySelector('button').onclick = () => { modal.remove(); window.removeEventListener('message', handler); };
    } else {
      // manual task - prompt for self-assessment score
      const score = prompt(`Task: ${task.title}\n\nRate your performance (0-100):`, '75');
      if (score !== null) {
        const s = parseInt(score);
        if (!isNaN(s) && s >= 0 && s <= 100) {
          await submitScore(taskId, s);
        } else alert('Please enter a number between 0 and 100');
      }
    }
  }

  async function submitScore(taskId, score) {
    const name = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
    const { error } = await supabase.from('task_completions').upsert({
      task_id: taskId,
      user_id: currentUser.id,
      user_name: name,
      user_avatar: currentUser.user_metadata?.avatar_url || null,
      score: score,
      completed_at: new Date().toISOString()
    }, { onConflict: 'task_id, user_id' });
    if (error) alert('Error saving score: ' + error.message);
    else {
      alert(`✅ Score ${score}% saved!`);
      await loadTasksAndDates();
    }
  }

  // Leaderboard (average score)
  async function renderLeaderboard() {
    const { data: completions } = await supabase.from('task_completions').select('user_id, user_name, user_avatar, score');
    const usersMap = new Map();
    (completions || []).forEach(c => {
      if (c.score !== null) {
        if (!usersMap.has(c.user_id)) usersMap.set(c.user_id, { name: c.user_name, avatar: c.user_avatar, scores: [] });
        usersMap.get(c.user_id).scores.push(c.score);
      }
    });
    const leaderboard = Array.from(usersMap.entries()).map(([id, data]) => ({
      id, name: data.name || 'Student', avatar: data.avatar,
      avgScore: data.scores.length ? Math.round(data.scores.reduce((a,b)=>a+b,0)/data.scores.length) : 0
    })).sort((a,b) => b.avgScore - a.avgScore);
    const top3 = leaderboard.slice(0,3);
    const podiumDiv = document.getElementById('leaderboard');
    if (leaderboard.length === 0) {
      podiumDiv.innerHTML = '<div class="lb-list" style="padding:32px;text-align:center">No scores yet. Complete tasks to appear!</div>';
      return;
    }
    let podiumHtml = `<div class="lb-podium">`;
    const order = [1,0,2]; // 2nd, 1st, 3rd
    const classes = ['second','first','third'];
    for (let i = 0; i < 3; i++) {
      const user = top3[order[i]];
      if (!user) { podiumHtml += '<div></div>'; continue; }
      podiumHtml += `
        <div class="podium-card ${classes[i]}">
          <div class="podium-avatar">${user.avatar ? `<img src="${user.avatar}" style="width:100%;height:100%;object-fit:cover">` : (user.name.charAt(0) || '?')}</div>
          <div>${escHtml(user.name)}</div>
          <div style="font-weight:700;font-size:24px;color:var(--primary)">${user.avgScore}%</div>
          <div style="font-size:11px">avg score</div>
        </div>
      `;
    }
    podiumHtml += `</div><div class="lb-list"><div class="lb-header"><div>Rank</div><div></div><div>Avg Score</div></div>`;
    leaderboard.forEach((u, idx) => {
      podiumHtml += `
        <div class="lb-row">
          <div>${idx+1}</div>
          <div class="lb-name"><div class="lb-avatar">${u.avatar ? `<img src="${u.avatar}" style="width:100%;height:100%;object-fit:cover">` : (u.name.charAt(0)||'?')}</div> ${escHtml(u.name)}</div>
          <div>${u.avgScore}%</div>
        </div>
      `;
    });
    podiumHtml += `</div>`;
    podiumDiv.innerHTML = podiumHtml;
  }

  // Avatar upload
  function openAvatarUpload() {
    document.getElementById('avatarFile').click();
  }
  async function uploadAvatar(input) {
    const file = input.files[0];
    if (!file) return;
    const fileExt = file.name.split('.').pop();
    const fileName = `${currentUser.id}/avatar.${fileExt}`;
    const { error: upErr } = await supabase.storage.from('avatars').upload(fileName, file, { upsert: true });
    if (upErr) { alert('Upload error: ' + upErr.message); return; }
    const { data: urlData } = supabase.storage.from('avatars').getPublicUrl(fileName);
    const avatarUrl = urlData.publicUrl + '?t=' + Date.now();
    await supabase.auth.updateUser({ data: { avatar_url: avatarUrl } });
    await loadUserProfile();
    await renderLeaderboard();
    alert('Avatar updated!');
  }

  // Session check
  supabase.auth.onAuthStateChange((event, session) => {
    if (session) {
      authContainer.style.display = 'none';
      dashboard.style.display = 'block';
      loadUserProfile();
    } else {
      authContainer.style.display = 'flex';
      dashboard.style.display = 'none';
      currentUser = null;
    }
  });

  // initial session check
  (async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      authContainer.style.display = 'none';
      dashboard.style.display = 'block';
      currentUser = session.user;
      await loadUserProfile();
    } else {
      authContainer.style.display = 'flex';
      dashboard.style.display = 'none';
    }
  })();

  window.closeModal = (btn) => btn.closest('.modal-overlay').remove();
  window.openTask = openTask;
</script>
</body>
</html>
