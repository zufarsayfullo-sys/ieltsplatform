<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Task: Ultra‑processed Food</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ffffff; color: #1a1a1a; font-family: 'Inter', sans-serif; line-height: 1.5; }
    .start-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:#fff; z-index:1000; display:flex; align-items:center; justify-content:center; text-align:center; }
    .start-overlay.hide { display: none; }
    .start-card { background:#f8fafc; padding:2rem; border-radius:32px; max-width:400px; }
    .start-btn { background:#111827; color:white; border:none; padding:12px 28px; border-radius:40px; font-size:1rem; font-weight:600; cursor:pointer; margin-top:16px; }
    .quiz-content { display: none; max-width:880px; margin:0 auto; padding:2rem 1.5rem; }
    .quiz-content.visible { display: block; }
    .container { background:white; border-radius:24px; padding:2rem; box-shadow:0 8px 20px rgba(0,0,0,0.05); }
    .video-wrapper { position:relative; padding-bottom:56.25%; margin:1.5rem 0; border-radius:16px; overflow:hidden; }
    .video-wrapper iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:none; }
    .question-card { border:1px solid #e2e8f0; border-radius:20px; padding:1.2rem; margin-bottom:1.2rem; }
    .question-text { font-weight:600; margin-bottom:0.75rem; }
    .options { display:flex; flex-direction:column; gap:0.6rem; }
    .option { display:flex; align-items:center; gap:0.75rem; padding:0.6rem 1rem; border:1px solid #e2e8f0; border-radius:14px; cursor:pointer; }
    .option.selected { background:#eff6ff; border-color:#3b82f6; }
    .option.correct { background:#ecfdf5; border-color:#10b981; }
    .option.wrong { background:#fef2f2; border-color:#ef4444; }
    .actions { display:flex; justify-content:space-between; margin:1.5rem 0; }
    button.primary { background:#111827; color:white; padding:0.65rem 1.4rem; border-radius:40px; border:none; cursor:pointer; }
    .score-area { margin-top:2rem; text-align:center; padding:1rem; background:#f8fafc; border-radius:24px; display:none; }
    .final-score { font-size:2.2rem; font-weight:700; }
    footer { font-size:0.7rem; text-align:center; margin-top:2rem; color:#94a3b8; }
  </style>
</head>
<body>
<div class="start-overlay" id="startOverlay">
  <div class="start-card">
    <h2>🎥 Video Task</h2>
    <p>Why can't we stop eating certain foods? (BBC)</p>
    <button class="start-btn" id="fullscreenStartBtn">🚀 Start Fullscreen Quiz</button>
  </div>
</div>
<div class="quiz-content" id="quizContent">
  <div class="container">
    <h1>🎥 Video: Ultra‑processed food</h1>
    <div class="video-wrapper"><iframe src="https://www.youtube.com/embed/J_03EXyhYS8" title="BBC - Why can't we stop eating?" frameborder="0" allowfullscreen></iframe></div>
    <div class="instruction" style="background:#fef9e3; padding:0.8rem; border-radius:12px; margin-bottom:1.5rem;">Watch the video and answer 5 questions. Your score will be sent automatically.</div>
    <div id="questions-area"></div>
    <div class="actions"><button id="checkBtn" class="primary">✅ Check answers</button><button id="restartBtn">⟳ Restart</button></div>
    <div id="scorePanel" class="score-area"><div class="final-score" id="scoreValue">0%</div><div id="scoreMessage"></div><hr><button id="restartFromScoreBtn">Retry</button></div>
    <footer>Score sent to IELTS dashboard.</footer>
  </div>
</div>
<script>
  // Fullscreen start
  const overlay = document.getElementById('startOverlay');
  const quizDiv = document.getElementById('quizContent');
  const startBtn = document.getElementById('fullscreenStartBtn');
  function requestFullscreenAndStart() {
    const elem = document.documentElement;
    const req = elem.requestFullscreen || elem.webkitRequestFullscreen || elem.mozRequestFullScreen || elem.msRequestFullscreen;
    if (req) { req.call(elem).then(() => { overlay.classList.add('hide'); quizDiv.classList.add('visible'); }).catch(() => { overlay.classList.add('hide'); quizDiv.classList.add('visible'); }); }
    else { overlay.classList.add('hide'); quizDiv.classList.add('visible'); }
  }
  startBtn.addEventListener('click', requestFullscreenAndStart);

  // Video quiz logic (5 questions from transcript)
  const questions = [
    { text: "According to Dr. Chris van Tulleken, what happened to obesity rates in the mid-1970s?", options: ["They remained stable.", "They started increasing across all groups simultaneously.", "They decreased.", "They only increased among older adults."], correct: 1 },
    { text: "Why is the 'failure of willpower' explanation not plausible?", options: ["Because people have always eaten the same.", "Because all groups would have simultaneously lost moral responsibility.", "Because willpower doesn't exist.", "Because obesity rates have always been high."], correct: 1 },
    { text: "What does John Ruff say about how food companies optimise products?", options: ["They focus only on reducing calories.", "They use trained sensory panels to rate texture, flavour, taste.", "They rely on government guidelines.", "They only care about packaging."], correct: 1 },
    { text: "What is 'vanishing caloric density'?", options: ["Zero‑calorie food.", "Soft, puffy foods that melt quickly and are consumed fast.", "Small portion sizes.", "Food cooked at high temperatures."], correct: 1 },
    { text: "What is the food industry's official response to concerns about ultra‑processed food?", options: ["They deny all responsibility.", "They claim to take it seriously, invest in healthier products, and support a labelling review.", "They stopped production.", "They blame consumers."], correct: 1 }
  ];
  let userAnswers = new Array(questions.length).fill(null);
  let evaluated = false;
  const questionsDiv = document.getElementById('questions-area');
  const checkBtn = document.getElementById('checkBtn');
  const restartBtn = document.getElementById('restartBtn');
  const scorePanel = document.getElementById('scorePanel');
  const scoreValueSpan = document.getElementById('scoreValue');
  const scoreMessageSpan = document.getElementById('scoreMessage');
  const restartFromScoreBtn = document.getElementById('restartFromScoreBtn');

  function renderQuestions() { /* same pattern as reading task – omitted for brevity but identical structure */ }
  function computeScore() { let c=0; for(let i=0;i<questions.length;i++) if(userAnswers[i]===questions[i].correct) c++; return Math.round((c/questions.length)*100); }
  function sendScoreToParent(score) { try { window.parent.postMessage({ type: 'IELTS_QUIZ_SCORE', score: score }, '*'); } catch(e) {} }
  function showScoreAndSend() { const pct=computeScore(); scoreValueSpan.innerText=`${pct}%`; scoreMessageSpan.innerText=pct>=80?"Excellent!":pct>=60?"Good!":"Try again"; scorePanel.style.display="block"; sendScoreToParent(pct); }
  function evaluateAndScore() { if(evaluated) return; evaluated=true; renderQuestions(); showScoreAndSend(); checkBtn.disabled=true; }
  function restartTask() { userAnswers.fill(null); evaluated=false; scorePanel.style.display="none"; checkBtn.disabled=false; renderQuestions(); }
  checkBtn.addEventListener('click', evaluateAndScore);
  restartBtn.addEventListener('click', restartTask);
  restartFromScoreBtn.addEventListener('click', restartTask);
  // Full rendering function (same as previous tasks)
  function renderQuestions() {
    questionsDiv.innerHTML = '';
    questions.forEach((q, idx) => {
      const card = document.createElement('div'); card.className = 'question-card';
      const qText = document.createElement('div'); qText.className = 'question-text'; qText.innerText = `${idx+1}. ${q.text}`;
      card.appendChild(qText);
      const optionsDiv = document.createElement('div'); optionsDiv.className = 'options';
      q.options.forEach((opt, optIdx) => {
        const optDiv = document.createElement('div'); optDiv.className = 'option';
        if (evaluated) optDiv.classList.add('disabled');
        if (userAnswers[idx] === optIdx && !evaluated) optDiv.classList.add('selected');
        if (evaluated) {
          if (optIdx === q.correct) optDiv.classList.add('correct');
          if (userAnswers[idx] === optIdx && userAnswers[idx] !== q.correct) optDiv.classList.add('wrong');
        }
        optDiv.innerHTML = `<span class="option-letter">${String.fromCharCode(65+optIdx)}</span><span class="option-text">${opt}</span>`;
        if (!evaluated) optDiv.addEventListener('click', () => { if (!evaluated) { userAnswers[idx] = optIdx; renderQuestions(); } });
        optionsDiv.appendChild(optDiv);
      });
      card.appendChild(optionsDiv);
      if (evaluated) {
        const fb = document.createElement('div'); fb.style.marginTop='0.6rem'; fb.style.fontSize='0.8rem';
        if (userAnswers[idx] === null) fb.innerText = '⚠️ Not answered.';
        else if (userAnswers[idx] === q.correct) fb.innerText = '✓ Correct!';
        else fb.innerText = `✗ Incorrect. Correct: ${String.fromCharCode(65+q.correct)}: ${q.options[q.correct]}`;
        card.appendChild(fb);
      }
      questionsDiv.appendChild(card);
    });
  }
  renderQuestions();
</script>
</body>
</html>
