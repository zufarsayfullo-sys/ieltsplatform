<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Prepositions Quiz · Day 1</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Source+Serif+4:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0f0e0c;
  --surface:#1a1916;
  --surface2:#232220;
  --border:#2e2c28;
  --text:#f0ebe0;
  --muted:#7a7468;
  --accent:#e8a030;
  --green:#4a9e6b;
  --red:#c04444;
  --radius:8px;
}

body{
  font-family:'Source Serif 4',Georgia,serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;padding:2rem 1rem 5rem;
  background-image:
    radial-gradient(ellipse 60% 40% at 80% 10%,rgba(232,160,48,.07) 0%,transparent 60%),
    radial-gradient(ellipse 40% 30% at 10% 90%,rgba(196,92,42,.05) 0%,transparent 60%);
}

/* NAV */
.nav{max-width:660px;margin:0 auto 2.5rem;display:flex;align-items:center;justify-content:space-between}
.nav-back{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .2s}
.nav-back:hover{color:var(--accent)}
.nav-tag{font-family:'JetBrains Mono',monospace;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;background:var(--surface2);border:1px solid var(--border);padding:.25rem .7rem;border-radius:99px;color:var(--muted)}

/* HEADER */
header{max-width:660px;margin:0 auto 2rem;padding-bottom:1.25rem;border-bottom:1px solid var(--border)}
.day-label{font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:.5rem}
h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,6vw,3rem);font-weight:700;line-height:1.1;letter-spacing:-.02em}
h1 em{font-style:italic;color:var(--accent)}
.subtitle{margin-top:.5rem;font-size:.9rem;font-weight:300;color:var(--muted)}

/* PROGRESS */
.progress-row{max-width:660px;margin:0 auto 1.5rem;display:flex;align-items:center;gap:1rem}
.progress-bar{flex:1;height:3px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1);width:0%}
.progress-label{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--muted);white-space:nowrap}

/* CARD */
.card{max-width:660px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:2rem;box-shadow:0 8px 40px rgba(0,0,0,.4);animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.q-meta{font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:1rem;display:flex;justify-content:space-between}
.question{font-family:'Playfair Display',serif;font-size:clamp(1.1rem,3vw,1.4rem);font-style:italic;line-height:1.6;margin-bottom:1.75rem;color:var(--text)}
.question .gap{display:inline-block;border-bottom:2px solid var(--accent);min-width:64px;text-align:center;font-style:normal;font-weight:700;color:var(--accent);padding:0 .2rem}

/* OPTIONS */
.options{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:1.5rem}
@media(max-width:460px){.options{grid-template-columns:1fr}}

.opt{display:flex;align-items:center;gap:.75rem;padding:.8rem 1rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface2);cursor:pointer;transition:border-color .15s,background .15s,transform .1s;user-select:none}
.opt:hover:not(.locked){border-color:var(--accent);background:#211f1a;transform:translateY(-1px)}
.opt.selected{border-color:var(--accent);background:#221e13}
.opt.correct{border-color:var(--green);background:#0e1f15}
.opt.wrong{border-color:var(--red);background:#1f0e0e}

.opt-key{font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:500;width:24px;height:24px;border-radius:5px;background:var(--border);color:var(--muted);display:grid;place-items:center;flex-shrink:0;transition:background .15s,color .15s}
.opt.selected .opt-key{background:var(--accent);color:#000}
.opt.correct  .opt-key{background:var(--green);color:#fff}
.opt.wrong    .opt-key{background:var(--red);color:#fff}
.opt-text{font-size:.95rem;color:var(--text)}

/* FEEDBACK */
.feedback{min-height:1.2rem;margin-bottom:1rem;font-family:'JetBrains Mono',monospace;font-size:.75rem;letter-spacing:.04em;opacity:0;transition:opacity .25s}
.feedback.show{opacity:1}
.feedback.ok{color:var(--green)}
.feedback.bad{color:var(--red)}

/* EXPLANATION */
.explanation{display:none;background:var(--bg);border-left:2px solid var(--accent);border-radius:0 var(--radius) var(--radius) 0;padding:.85rem 1.1rem;font-size:.88rem;line-height:1.7;color:#c8c0b0;margin-bottom:1.25rem}
.explanation.show{display:block}
.explanation strong{color:var(--accent)}

/* ACTIONS */
.actions{display:flex;justify-content:flex-end;gap:.75rem}
.btn{font-family:'Source Serif 4',serif;font-size:.9rem;font-weight:600;padding:.6rem 1.5rem;border-radius:var(--radius);border:1px solid transparent;cursor:pointer;transition:all .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#0f0e0c;border-color:var(--accent)}
.btn-primary:hover{background:#f0b040}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-ghost{background:transparent;color:var(--muted);border-color:var(--border);display:none}
.btn-ghost:hover{color:var(--text);border-color:var(--muted)}

/* SCORE */
#score-screen{display:none;max-width:660px;margin:0 auto;text-align:center}
#score-screen h2{font-family:'Playfair Display',serif;font-size:2.4rem;margin-bottom:.5rem}
.score-ring{width:130px;height:130px;border-radius:50%;margin:1.5rem auto;background:conic-gradient(var(--accent) var(--pct,0%),var(--surface2) 0%);display:grid;place-items:center;position:relative}
.score-ring::after{content:'';width:96px;height:96px;border-radius:50%;background:var(--bg);position:absolute}
.score-ring span{font-family:'Playfair Display',serif;font-size:1.7rem;position:relative;z-index:1}
.score-msg{color:var(--muted);font-size:.95rem;margin-bottom:1.75rem;font-weight:300}

.review-list{text-align:left;margin:0 auto 2rem;max-width:520px;display:flex;flex-direction:column;gap:.5rem}
.review-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.7rem 1rem;font-size:.85rem;line-height:1.5;display:flex;gap:.75rem;align-items:flex-start}
.review-item.ok{border-color:var(--green)}
.review-item.bad{border-color:var(--red)}
.review-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:.35rem}
.ok .review-dot{background:var(--green)}
.bad .review-dot{background:var(--red)}
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-back" href="../../index.html">← Home</a>
  <span class="nav-tag">Grammar</span>
</nav>

<header>
  <div class="day-label">Day 1 · May 1, 2025</div>
  <h1>Prep<em>os</em>itions</h1>
  <p class="subtitle">10 questions · ~8 minutes · Intermediate</p>
</header>

<div class="progress-row">
  <div class="progress-bar"><div class="progress-fill" id="pfill"></div></div>
  <div class="progress-label" id="plabel">0 / 10</div>
</div>

<div class="card" id="quiz-card">
  <div class="q-meta">
    <span id="q-num">Question 1 of 10</span>
    <span>Fill in the blank</span>
  </div>
  <div class="question" id="q-text"></div>
  <div class="options" id="options"></div>
  <div class="feedback" id="feedback"></div>
  <div class="explanation" id="explanation"></div>
  <div class="actions">
    <button class="btn btn-ghost" id="btn-next">Next →</button>
    <button class="btn btn-primary" id="btn-check" disabled>Check</button>
  </div>
</div>

<div id="score-screen">
  <h2>Quiz Complete</h2>
  <div class="score-ring" id="score-ring"><span id="score-frac"></span></div>
  <p class="score-msg" id="score-msg"></p>
  <div class="review-list" id="review-list"></div>
  <button class="btn btn-primary" id="btn-restart" style="margin:0 auto;display:block">Try Again</button>
</div>

<script>
const Q=[
  {q:"She has been waiting ___ two hours.",answer:"for",opts:["since","for","during","from"],exp:"Use <strong>for</strong> with a <em>duration</em> (two hours, three days). Use <strong>since</strong> with a point in time (since Monday)."},
  {q:"I haven't seen him ___ last Friday.",answer:"since",opts:["for","since","from","in"],exp:"<strong>Since</strong> marks the starting point of a continuing state. <strong>For</strong> marks how long it has lasted."},
  {q:"The meeting is ___ Monday morning.",answer:"on",opts:["in","at","on","by"],exp:"Use <strong>on</strong> with days and dates. <strong>In</strong> → months/years. <strong>At</strong> → clock times."},
  {q:"We arrived ___ the airport two hours early.",answer:"at",opts:["in","to","at","on"],exp:"<strong>At</strong> is used for specific points/venues (airport, station). <strong>In</strong> is used for cities and countries."},
  {q:"He is very good ___ solving puzzles.",answer:"at",opts:["in","on","at","with"],exp:"Fixed collocation: <strong>good at</strong> + gerund. Also: skilled at, terrible at, brilliant at."},
  {q:"The cat is hiding ___ the sofa.",answer:"under",opts:["above","between","under","across"],exp:"<strong>Under</strong> = directly below. <strong>Below</strong> = lower but not necessarily directly beneath."},
  {q:"She divided the prize ___ the three winners.",answer:"among",opts:["between","among","across","within"],exp:"<strong>Among</strong> = three or more. <strong>Between</strong> = exactly two."},
  {q:"He apologised ___ being late.",answer:"for",opts:["about","of","for","with"],exp:"Fixed collocation: <strong>apologise for</strong> + gerund. 'Apologise for the delay.'"},
  {q:"I'm not familiar ___ this software.",answer:"with",opts:["to","of","about","with"],exp:"Fixed collocation: <strong>familiar with</strong>. 'Are you familiar with this procedure?'"},
  {q:"The café is ___ the bookshop and the bank.",answer:"between",opts:["among","beside","between","across"],exp:"<strong>Between</strong> = in the middle of exactly two reference points."}
];
const KEYS=['A','B','C','D'];
let cur=0,score=0,answered=0,selected=null,locked=false,results=[];

const qNum=document.getElementById('q-num'),qText=document.getElementById('q-text'),
  optWrap=document.getElementById('options'),feedback=document.getElementById('feedback'),
  expl=document.getElementById('explanation'),btnCheck=document.getElementById('btn-check'),
  btnNext=document.getElementById('btn-next'),pfill=document.getElementById('pfill'),
  plabel=document.getElementById('plabel'),quizCard=document.getElementById('quiz-card'),
  scoreSc=document.getElementById('score-screen');

function shuffle(a){return[...a].sort(()=>Math.random()-.5)}

function render(){
  selected=null;locked=false;
  feedback.className='feedback';feedback.textContent='';
  expl.className='explanation';expl.innerHTML='';
  btnCheck.disabled=true;btnCheck.style.display='';btnNext.style.display='none';
  const q=Q[cur];
  qNum.textContent=`Question ${cur+1} of ${Q.length}`;
  qText.innerHTML=q.q.replace('___','<span class="gap">___</span>');
  optWrap.innerHTML='';
  shuffle(q.opts).forEach((o,i)=>{
    const el=document.createElement('div');
    el.className='opt';el.dataset.v=o;
    el.innerHTML=`<span class="opt-key">${KEYS[i]}</span><span class="opt-text">${o}</span>`;
    el.addEventListener('click',()=>{
      if(locked)return;
      document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));
      el.classList.add('selected');selected=o;btnCheck.disabled=false;
    });
    optWrap.appendChild(el);
  });
}

function check(){
  if(!selected||locked)return;
  locked=true;const q=Q[cur];const ok=selected===q.answer;
  if(ok)score++;answered++;results.push({q:q.q,answer:q.answer,chosen:selected,ok});
  document.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('locked');
    if(o.dataset.v===q.answer)o.classList.add('correct');
    else if(o.dataset.v===selected&&!ok)o.classList.add('wrong');
  });
  feedback.textContent=ok?'✓ Correct!':`✗ The answer is "${q.answer}"`;
  feedback.className='feedback show '+(ok?'ok':'bad');
  expl.innerHTML=q.exp;expl.className='explanation show';
  pfill.style.width=(answered/Q.length*100)+'%';
  plabel.textContent=`${answered} / ${Q.length}`;
  btnCheck.style.display='none';btnNext.style.display='';
  btnNext.textContent=cur<Q.length-1?'Next →':'See Results';
}

function showScore(){
  quizCard.style.display='none';scoreSc.style.display='block';
  const pct=Math.round(score/Q.length*100);
  document.getElementById('score-ring').style.setProperty('--pct',pct+'%');
  document.getElementById('score-frac').textContent=`${score}/${Q.length}`;
  const msgs=[[0,50,'Keep going — prepositions take practice! 💪'],[50,70,'Good effort! Review the explanations. 📖'],[70,90,'Well done — solid grasp! 🎯'],[90,101,'Excellent! Near-perfect! 🏆']];
  document.getElementById('score-msg').textContent=(msgs.find(([lo,hi])=>pct>=lo&&pct<hi)||['','',''])[2];
  const list=document.getElementById('review-list');list.innerHTML='';
  results.forEach(r=>{
    const d=document.createElement('div');
    d.className='review-item '+(r.ok?'ok':'bad');
    d.innerHTML=`<span class="review-dot"></span><div><div style="font-weight:600;margin-bottom:.2rem">${r.q.replace('___','<u>'+r.answer+'</u>')}</div>${r.ok?'Correct ✓':`You chose <strong style="color:var(--red)">${r.chosen}</strong> — correct: <strong style="color:var(--green)">${r.answer}</strong>`}</div>`;
    list.appendChild(d);
  });
}

btnCheck.addEventListener('click',check);
btnNext.addEventListener('click',()=>{ cur++; cur<Q.length?render():showScore(); });
document.getElementById('btn-restart').addEventListener('click',()=>{
  cur=0;score=0;answered=0;results=[];
  pfill.style.width='0%';plabel.textContent='0 / 10';
  scoreSc.style.display='none';quizCard.style.display='';render();
});

render();
</script>
</body>
</html>
