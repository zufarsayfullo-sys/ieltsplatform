<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Platform · Teacher Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #1a1a3e 50%, #24243e 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 20px 25px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        h1 {
            color: white;
            font-size: 1.5rem;
        }
        .back-link, .logout-btn {
            color: #a8b2ff;
            text-decoration: none;
            background: rgba(255,255,255,0.1);
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            border: none;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }
        .students-table {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 20px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: white;
        }
        th {
            color: #a8b2ff;
            font-weight: 600;
        }
        .score-badge {
            background: #667eea;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
        }
        .grade-btn {
            background: #48bb78;
            border: none;
            padding: 6px 15px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            margin-left: 5px;
        }
        .grade-input {
            width: 75px;
            padding: 6px;
            border-radius: 8px;
            border: none;
            text-align: center;
        }
        .login-info {
            text-align: center;
            padding: 20px;
            background: rgba(255,215,0,0.1);
            border-radius: 16px;
            margin-bottom: 20px;
            color: #ffd700;
        }
        .teacher-badge {
            background: #ffd700;
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-left: 10px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(255,255,255,0.6);
        }
        @media (max-width: 768px) {
            .header { flex-direction: column; text-align: center; }
            th, td { font-size: 12px; padding: 8px; }
            .grade-input { width: 55px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👩‍🏫 Teacher Dashboard <span class="teacher-badge" id="teacherBadge">Loading...</span></h1>
            <div>
                <a href="index.html" class="back-link">← Student View</a>
                <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
            </div>
        </div>

        <div id="loginInfo" class="login-info">
            ⚠️ Checking teacher access...
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="loading">Loading stats...</div>
        </div>

        <div class="students-table">
            <h3 style="color: white; margin-bottom: 15px;">📋 All Students Progress</h3>
            <div id="studentsTable">
                <div class="loading">Loading students...</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ============================================================
        // YOUR SUPABASE CREDENTIALS (already inserted)
        // ============================================================
        const SUPABASE_URL = 'https://wqoshwbtxulnlfccbuvi.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indxb3Nod2J0eHVsbmxmY2NidXZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0ODAwMTgsImV4cCI6MjA5MzA1NjAxOH0.ChxkoIlruVPtontdf0_uvG__XSpZdVhScxR1f-F_ArA';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null;

        // ------------------------------------------------------------
        // Check if logged-in user is a teacher
        // ------------------------------------------------------------
        async function checkTeacher() {
            const { data: { user }, error: userError } = await supabase.auth.getUser();

            if (userError || !user) {
                document.getElementById('loginInfo').innerHTML = '🔐 Please sign in as teacher: <button onclick="signIn()" style="background:#667eea; border:none; margin-top:10px; padding:8px 20px; border-radius:20px; color:white; cursor:pointer;">Sign In</button>';
                document.getElementById('teacherBadge').textContent = 'Not Signed In';
                return false;
            }

            // Fetch user role from students table
            const { data: student, error: roleError } = await supabase
                .from('students')
                .select('role')
                .eq('id', user.id)
                .maybeSingle();

            if (roleError || !student || student.role !== 'teacher') {
                document.getElementById('loginInfo').innerHTML = '❌ You are not authorized as a teacher. Only teachers can access this page.';
                document.getElementById('teacherBadge').textContent = 'Unauthorized';
                document.getElementById('statsGrid').innerHTML = '';
                document.getElementById('studentsTable').innerHTML = '';
                return false;
            }

            currentUser = user;
            document.getElementById('loginInfo').innerHTML = `✅ Logged in as: ${user.email} (Teacher)`;
            document.getElementById('teacherBadge').textContent = 'Teacher';
            await loadTeacherData();
            return true;
        }

        // ------------------------------------------------------------
        // Load all student data and statistics
        // ------------------------------------------------------------
        async function loadTeacherData() {
            // Get all students
            const { data: students } = await supabase
                .from('students')
                .select('*')
                .order('created_at', { ascending: false });

            // Get all progress submissions
            const { data: allProgress } = await supabase.from('progress').select('*');

            // Leaderboard view (optional, for extra stats)
            const { data: leaderboard } = await supabase.from('leaderboard_view').select('*');

            const totalStudents = students?.length || 0;
            const totalSubmissions = allProgress?.length || 0;
            const avgScore = allProgress?.length
                ? Math.round(allProgress.reduce((sum, p) => sum + (p.speaking_score || 0), 0) / allProgress.length)
                : 0;
            const activeToday = allProgress?.filter(p => p.task_date === new Date().toISOString().split('T')[0]).length || 0;

            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card"><div class="stat-number">${totalStudents}</div><div>Total Students</div></div>
                <div class="stat-card"><div class="stat-number">${totalSubmissions}</div><div>Total Submissions</div></div>
                <div class="stat-card"><div class="stat-number">${avgScore}</div><div>Average Score</div></div>
                <div class="stat-card"><div class="stat-number">${activeToday}</div><div>Active Today</div></div>
            `;

            if (!students || students.length === 0) {
                document.getElementById('studentsTable').innerHTML = '<div class="loading">No students yet. Ask someone to sign up.</div>';
                return;
            }

            // Build table rows
            let tableRows = '';
            for (const student of students) {
                // Get student's latest submission (if any)
                const { data: submissions } = await supabase
                    .from('progress')
                    .select('*')
                    .eq('student_id', student.id)
                    .order('submitted_at', { ascending: false })
                    .limit(1);

                const lastSubmission = submissions?.[0];
                const lastScore = lastSubmission?.speaking_score || '—';
                const lastDate = lastSubmission?.submitted_at
                    ? new Date(lastSubmission.submitted_at).toLocaleDateString()
                    : 'Never';

                tableRows += `
                    <tr>
                        <td>${escapeHtml(student.full_name || student.email.split('@')[0])}</td>
                        <td>${escapeHtml(student.email)}</td>
                        <td><span class="score-badge">${student.role || 'student'}</span></td>
                        <td>${new Date(student.created_at).toLocaleDateString()}</td>
                        <td>${lastScore}</td>
                        <td>${lastDate}</td>
                        <td>
                            <input type="number" class="grade-input" id="grade-${student.id}" placeholder="Score" min="0" max="100">
                            <button class="grade-btn" onclick="gradeStudent('${student.id}')">Save</button>
                        </td>
                    </tr>
                `;
            }

            document.getElementById('studentsTable').innerHTML = `
                <table>
                    <thead>
                        <tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th>Last Score</th><th>Last Active</th><th>Grade</th></tr>
                    </thead>
                    <tbody>
                        ${tableRows}
                    </tbody>
                </table>
            `;
        }

        // ------------------------------------------------------------
        // Grade a student (insert/update progress for today)
        // ------------------------------------------------------------
        async function gradeStudent(studentId) {
            const scoreInput = document.getElementById(`grade-${studentId}`);
            const score = parseInt(scoreInput.value);

            if (isNaN(score) || score < 0 || score > 100) {
                alert('Please enter a valid score between 0 and 100');
                return;
            }

            const today = new Date().toISOString().split('T')[0];

            // Upsert: if a record for today exists, update it; otherwise insert
            const { error } = await supabase
                .from('progress')
                .upsert({
                    student_id: studentId,
                    task_date: today,
                    speaking_score: score,
                    task_completed: true,
                    submitted_at: new Date().toISOString()
                }, { onConflict: 'student_id, task_date' });

            if (error) {
                alert('Error saving grade: ' + error.message);
            } else {
                alert(`✅ Grade ${score} saved for student!`);
                scoreInput.value = '';
                // Refresh the table to show updated last score
                await loadTeacherData();
            }
        }

        // ------------------------------------------------------------
        // Sign in helper (called when not logged in)
        // ------------------------------------------------------------
        async function signIn() {
            const email = prompt('Enter your teacher email:');
            const password = prompt('Enter your password:');
            if (!email || !password) return;

            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                alert('Login failed: ' + error.message);
            } else {
                location.reload(); // reload to show dashboard
            }
        }

        // ------------------------------------------------------------
        // Logout
        // ------------------------------------------------------------
        async function signOut() {
            await supabase.auth.signOut();
            location.reload();
        }

        // ------------------------------------------------------------
        // Helper: escape HTML to prevent injection
        // ------------------------------------------------------------
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // ------------------------------------------------------------
        // Attach global functions and initialize
        // ------------------------------------------------------------
        window.gradeStudent = gradeStudent;
        window.signIn = signIn;

        document.getElementById('logoutBtn').addEventListener('click', signOut);

        checkTeacher();
    </script>
</body>
</html>
