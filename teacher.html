<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teacher Dashboard - IELTS Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0f0c29;
            color: white;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: auto;
            background: rgba(0,0,0,0.6);
            padding: 30px;
            border-radius: 20px;
        }
        input, button {
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: none;
            width: 100%;
            max-width: 300px;
        }
        button {
            background: #667eea;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid #333;
        }
        .error {
            color: #ff6b6b;
        }
        .success {
            color: #48bb78;
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1>👩‍🏫 Teacher Dashboard</h1>
    <div id="content">
        <!-- Login form will appear here immediately -->
    </div>
</div>

<script>
    // Supabase configuration
    const SUPABASE_URL = 'https://wqoshwbtxulnlfccbuvi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indxb3Nod2J0eHVsbmxmY2NidXZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0ODAwMTgsImV4cCI6MjA5MzA1NjAxOH0.ChxkoIlruVPtontdf0_uvG__XSpZdVhScxR1f-F_ArA';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const contentDiv = document.getElementById('content');

    // Function to display login form
    function showLoginForm(errorMsg = '') {
        contentDiv.innerHTML = `
            <h2>🔐 Teacher Login Required</h2>
            <p>Please sign in with your teacher account.</p>
            <input type="email" id="teacherEmail" placeholder="Email address"><br>
            <input type="password" id="teacherPassword" placeholder="Password"><br>
            <button id="loginBtn">Sign In</button>
            <p class="error" style="margin-top:10px;">${errorMsg}</p>
            <p style="font-size:12px; margin-top:20px;">First time? Sign up on the <a href="index.html" style="color:#ffd700;">student dashboard</a> then get your role upgraded by admin.</p>
        `;
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('teacherEmail').value;
            const password = document.getElementById('teacherPassword').value;
            if (!email || !password) {
                showLoginForm('Please enter email and password');
                return;
            }
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                showLoginForm('Login failed: ' + error.message);
            } else {
                // Reload page to show dashboard after successful login
                window.location.reload();
            }
        });
    }

    // Check if user is already logged in
    async function checkSession() {
        const { data: { user }, error } = await supabase.auth.getUser();
        if (error || !user) {
            showLoginForm();
            return;
        }

        // User is logged in – verify teacher role
        const { data: student, error: roleError } = await supabase
            .from('students')
            .select('role')
            .eq('id', user.id)
            .maybeSingle();

        if (roleError || !student || student.role !== 'teacher') {
            contentDiv.innerHTML = `
                <p class="error">❌ Access denied. Your account is not a teacher.</p>
                <p>Only teachers can view this page. If you are a teacher, ask an administrator to set your role.</p>
                <button id="logoutBtn">Sign Out</button>
            `;
            document.getElementById('logoutBtn').addEventListener('click', async () => {
                await supabase.auth.signOut();
                window.location.reload();
            });
            return;
        }

        // Teacher confirmed – load class statistics and student list
        contentDiv.innerHTML = `<p class="success">✅ Logged in as: ${user.email} (Teacher)</p>
                                <h3>📊 Class Statistics</h3>
                                <div id="stats"></div>
                                <h3>📋 All Students</h3>
                                <div id="studentsTable"></div>
                                <button id="logoutBtn" style="margin-top:20px;">Sign Out</button>`;

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.reload();
        });

        // Fetch data
        const { data: students } = await supabase.from('students').select('*');
        const { data: allProgress } = await supabase.from('progress').select('*');

        const totalStudents = students?.length || 0;
        const totalSubmissions = allProgress?.length || 0;
        const avgScore = allProgress?.length ? Math.round(allProgress.reduce((a,b)=>a+(b.speaking_score||0),0)/allProgress.length) : 0;

        document.getElementById('stats').innerHTML = `
            <p>👥 Total Students: ${totalStudents}</p>
            <p>📝 Total Submissions: ${totalSubmissions}</p>
            <p>⭐ Average Score: ${avgScore}</p>
        `;

        if (!students || students.length === 0) {
            document.getElementById('studentsTable').innerHTML = '<p>No students yet.</p>';
            return;
        }

        let tableHtml = `<table><th>Name</th><th>Email</th><th>Role</th><th>Last Score</th><th>Grade Today</th></tr>`;
        for (const s of students) {
            // Get last score
            const { data: lastProgress } = await supabase
                .from('progress')
                .select('speaking_score')
                .eq('student_id', s.id)
                .order('submitted_at', { ascending: false })
                .limit(1);
            const lastScore = lastProgress?.[0]?.speaking_score || '—';

            tableHtml += `
                <tr>
                    <td>${escapeHtml(s.full_name || s.email.split('@')[0])}</td>
                    <td>${escapeHtml(s.email)}</td>
                    <td>${s.role || 'student'}</td>
                    <td>${lastScore}</td>
                    <td>
                        <input type="number" id="grade_${s.id}" placeholder="0-100" style="width:70px;">
                        <button onclick="gradeStudent('${s.id}')">Save</button>
                    </td>
                </tr>
            `;
        }
        document.getElementById('studentsTable').innerHTML = tableHtml;

        window.gradeStudent = async (studentId) => {
            const input = document.getElementById(`grade_${studentId}`);
            const score = parseInt(input.value);
            if (isNaN(score) || score < 0 || score > 100) {
                alert('Enter a score between 0 and 100');
                return;
            }
            const today = new Date().toISOString().split('T')[0];
            const { error } = await supabase
                .from('progress')
                .upsert({
                    student_id: studentId,
                    task_date: today,
                    speaking_score: score,
                    task_completed: true,
                    submitted_at: new Date().toISOString()
                }, { onConflict: 'student_id, task_date' });
            if (error) {
                alert('Error: ' + error.message);
            } else {
                alert('Grade saved!');
                location.reload();
            }
        };
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Start the app
    checkSession();
</script>
</body>
</html>
