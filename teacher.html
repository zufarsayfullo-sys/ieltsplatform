<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teacher Dashboard (Simple & Working)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #1a1a2e; color: white; }
        .container { max-width: 1000px; margin: auto; background: rgba(0,0,0,0.6); padding: 30px; border-radius: 16px; }
        input, button { padding: 10px; margin: 5px; border-radius: 8px; border: none; }
        button { background: #667eea; color: white; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #333; }
        .error { color: #ff6b6b; }
        .success { color: #48bb78; }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1>👩‍🏫 Teacher Dashboard</h1>
    <div id="content">Loading...</div>
</div>

<script>
    // YOUR SUPABASE CREDENTIALS
    const SUPABASE_URL = 'https://wqoshwbtxulnlfccbuvi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indxb3Nod2J0eHVsbmxmY2NidXZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0ODAwMTgsImV4cCI6MjA5MzA1NjAxOH0.ChxkoIlruVPtontdf0_uvG__XSpZdVhScxR1f-F_ArA';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const app = document.getElementById('app');
    const contentDiv = document.getElementById('content');

    // Helper to show login form
    function showLoginForm(errorMsg = '') {
        contentDiv.innerHTML = `
            <h2>🔐 Teacher Login</h2>
            <input type="email" id="teacherEmail" placeholder="Your email" style="width: 80%;"><br>
            <input type="password" id="teacherPassword" placeholder="Password" style="width: 80%;"><br>
            <button id="loginBtn">Sign In</button>
            <p class="error" style="margin-top:10px;">${errorMsg}</p>
        `;
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('teacherEmail').value;
            const password = document.getElementById('teacherPassword').value;
            if (!email || !password) {
                showLoginForm('Please enter email and password');
                return;
            }
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                showLoginForm('Login failed: ' + error.message);
            } else {
                // Reload to show dashboard
                window.location.reload();
            }
        });
    }

    // Main function: check session and display dashboard or login
    async function init() {
        const { data: { user }, error } = await supabase.auth.getUser();
        if (error || !user) {
            showLoginForm();
            return;
        }

        // Check teacher role
        const { data: student, error: roleError } = await supabase
            .from('students')
            .select('role')
            .eq('id', user.id)
            .maybeSingle();

        if (roleError || !student || student.role !== 'teacher') {
            contentDiv.innerHTML = `<p class="error">⛔ Access denied. You are not a teacher.</p>
                                    <button onclick="logout()">Sign Out</button>`;
            window.logout = async () => {
                await supabase.auth.signOut();
                window.location.reload();
            };
            return;
        }

        // Teacher is authenticated – load student data
        contentDiv.innerHTML = `<p class="success">✅ Logged in as: ${user.email} (Teacher)</p>
                                 <h3>📊 Class Statistics</h3>
                                 <div id="stats"></div>
                                 <h3>📋 All Students</h3>
                                 <div id="studentsTable"></div>`;

        // Fetch data
        const { data: students } = await supabase.from('students').select('*');
        const { data: progress } = await supabase.from('progress').select('*');

        const total = students?.length || 0;
        const totalSubmissions = progress?.length || 0;
        const avgScore = progress?.length ? Math.round(progress.reduce((a,b)=>a+(b.speaking_score||0),0)/progress.length) : 0;
        document.getElementById('stats').innerHTML = `
            <p>📈 Total Students: ${total}</p>
            <p>📝 Total Submissions: ${totalSubmissions}</p>
            <p>⭐ Average Score: ${avgScore}</p>
        `;

        if (!students || students.length === 0) {
            document.getElementById('studentsTable').innerHTML = '<p>No students yet.</p>';
            return;
        }

        // Build table
        let html = `<table><tr><th>Name</th><th>Email</th><th>Role</th><th>Last Score</th><th>Grade</th></tr>`;
        for (const s of students) {
            const { data: last } = await supabase
                .from('progress')
                .select('speaking_score')
                .eq('student_id', s.id)
                .order('submitted_at', { ascending: false })
                .limit(1);
            const lastScore = last?.[0]?.speaking_score || '—';
            html += `
                <tr>
                    <td>${s.full_name || s.email.split('@')[0]}</td>
                    <td>${s.email}</td>
                    <td>${s.role || 'student'}</td>
                    <td>${lastScore}</td>
                    <td><input type="number" id="score_${s.id}" placeholder="0-100" style="width:60px;"><button onclick="gradeStudent('${s.id}')">Save</button></td>
                </tr>
            `;
        }
        html += `</table><br><button onclick="logout()">Logout</button>`;
        document.getElementById('studentsTable').innerHTML = html;

        // Make grading function global
        window.gradeStudent = async (studentId) => {
            const scoreInput = document.getElementById(`score_${studentId}`);
            const score = parseInt(scoreInput.value);
            if (isNaN(score) || score < 0 || score > 100) {
                alert('Enter score 0-100');
                return;
            }
            const today = new Date().toISOString().split('T')[0];
            const { error } = await supabase
                .from('progress')
                .upsert({
                    student_id: studentId,
                    task_date: today,
                    speaking_score: score,
                    task_completed: true,
                    submitted_at: new Date().toISOString()
                }, { onConflict: 'student_id, task_date' });
            if (error) alert('Error: ' + error.message);
            else {
                alert('Grade saved!');
                // Reload table to update last score
                init();
            }
        };
        window.logout = async () => {
            await supabase.auth.signOut();
            window.location.reload();
        };
    }

    init();
</script>
</body>
</html>
