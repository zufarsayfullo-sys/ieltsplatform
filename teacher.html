<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teacher Dashboard (Direct Check)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial; background: #1a1a2e; color: white; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: rgba(0,0,0,0.6); padding: 30px; border-radius: 16px; }
        button, input { padding: 8px; margin: 5px; }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1>👩‍🏫 Teacher Dashboard</h1>
    <div id="content">Loading...</div>
</div>

<script>
    const SUPABASE_URL = 'https://wqoshwbtxulnlfccbuvi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indxb3Nod2J0eHVsbmxmY2NidXZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0ODAwMTgsImV4cCI6MjA5MzA1NjAxOH0.ChxkoIlruVPtontdf0_uvG__XSpZdVhScxR1f-F_ArA';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const content = document.getElementById('content');

    async function init() {
        // Get current session
        const { data: { user }, error } = await supabase.auth.getUser();
        if (error || !user) {
            content.innerHTML = `<h2>🔐 Login Required</h2>
                <input id="email" placeholder="Email"><br>
                <input id="password" type="password" placeholder="Password"><br>
                <button onclick="login()">Login</button>`;
            window.login = async () => {
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) alert(error.message);
                else location.reload();
            };
            return;
        }

        // Directly check if this user is a teacher by querying the students table
        const { data: student, error: roleError } = await supabase
            .from('students')
            .select('role')
            .eq('id', user.id)
            .maybeSingle();

        if (roleError || !student || student.role !== 'teacher') {
            content.innerHTML = `<p>❌ Access denied. Your role: ${student?.role || 'none'}. Only teachers can view this page.</p>
                                 <button onclick="logout()">Sign Out</button>`;
            window.logout = async () => { await supabase.auth.signOut(); location.reload(); };
            return;
        }

        // Teacher confirmed – load all students
        content.innerHTML = `<p>✅ Logged in as: ${user.email} (Teacher)</p>
                             <h3>All Students</h3>
                             <div id="studentsList"></div>
                             <button onclick="logout()">Sign Out</button>`;

        const { data: students } = await supabase.from('students').select('*');
        if (students && students.length) {
            let html = '<ul>';
            students.forEach(s => {
                html += `<li>${s.email} (${s.role || 'student'})</li>`;
            });
            html += '</ul>';
            document.getElementById('studentsList').innerHTML = html;
        } else {
            document.getElementById('studentsList').innerHTML = '<p>No students yet.</p>';
        }
    }

    init();
</script>
</body>
</html>
